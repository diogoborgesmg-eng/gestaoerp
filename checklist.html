<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Pré-Preparo — Di Casa Laranjinha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; padding: 14px; max-width: 520px; margin: 0 auto; }
  h1 { color: #ff6b35; font-size: 1.15rem; text-align: center; margin-bottom: 2px; }
  .sub { text-align: center; color: #666; font-size: 0.78rem; margin-bottom: 10px; }
  .nome-box { background: #1a1a2e; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .nome-box label { font-size: 0.85rem; font-weight: 700; white-space: nowrap; color: #aaa; }
  .nome-box input { flex: 1; background: #0f0f1a; border: 1.5px solid #ff6b35; border-radius: 8px; padding: 7px 10px; font-size: 0.9rem; color: #fff; }
  .nome-box button { background: #ff6b35; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  .progress-bar { background: #1a1a2e; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 6px; }
  .progress-text span:last-child { color: #00cc66; font-weight: 700; }
  .bar-bg { background: #2a2a3e; border-radius: 20px; height: 8px; }
  .bar-fill { background: linear-gradient(90deg,#ff6b35,#00cc66); height: 8px; border-radius: 20px; transition: width 0.3s; }
  .quem-box { background: #1a2a1a; border-radius: 12px; padding: 10px; margin-bottom: 8px; display: none; }
  .quem-box h3 { font-size: 0.78rem; color: #00cc66; margin-bottom: 5px; }
  .tag { display: inline-block; background: #0f2a0f; color: #00cc66; border-radius: 20px; padding: 2px 10px; margin: 2px; font-size: 0.75rem; }
  .secao { margin-bottom: 8px; }
  .secao-titulo { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; color: #555; padding: 6px 4px 4px; border-bottom: 1px solid #1a1a2e; margin-bottom: 4px; }
  .item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; background: #1a1a2e; border-radius: 10px; padding: 9px 10px; margin-bottom: 4px; }
  .item.ok { background: #0f2a0f; }
  .item-nome { font-size: 0.85rem; font-weight: 600; }
  .item-por { font-size: 0.68rem; color: #00cc66; margin-top: 2px; }
  .qty-box { display: flex; align-items: center; gap: 4px; }
  .qty-btn { width: 26px; height: 26px; border-radius: 7px; border: none; background: #2a2a3e; color: #fff; font-size: 1rem; cursor: pointer; }
  .qty-btn:active { background: #3a3a4e; }
  .qty-input { width: 46px; text-align: center; background: #0f0f1a; border: 1px solid #333; border-radius: 7px; color: #fff; font-size: 0.88rem; padding: 4px; }
  .qty-unit { font-size: 0.7rem; color: #555; min-width: 18px; }
  .btn-salvar { width:100%; background:#00cc66; color:#0f0f1a; border:none; border-radius:12px; padding:14px; font-size:1rem; font-weight:800; cursor:pointer; margin-top:10px; margin-bottom:6px; }
  .btn-lista { width:100%; background:#1a1a2e; color:#ff6b35; border:1px solid #ff6b35; border-radius:12px; padding:12px; font-size:0.9rem; font-weight:700; cursor:pointer; margin-bottom:6px; }
  .btn-reset { width:100%; background:#1a0f0f; color:#ff4444; border:1px solid #ff4444; border-radius:12px; padding:10px; font-size:0.85rem; font-weight:600; cursor:pointer; }
  .lista-compras { background:#1a1a2e; border-radius:12px; padding:14px; margin-top:10px; display:none; }
  .lista-compras h2 { color:#ff6b35; font-size:0.95rem; margin-bottom:10px; }
  .lista-item { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #2a2a3e; font-size:0.85rem; }
  .lista-item:last-child { border-bottom:none; }
  .lista-qtd { color:#ff6b35; font-weight:700; }
  .sync-info { text-align:center; font-size:0.7rem; color:#333; margin:4px 0 8px; }
</style>
</head>
<body>
<h1>✅ Checklist Pré-Preparo</h1>
<p class="sub">Informe a quantidade de cada item no estoque</p>
<div class="nome-box">
  <label>👤</label>
  <input type="text" id="nomeInput" placeholder="Seu nome..." maxlength="20">
  <button onclick="confirmarNome()">OK</button>
</div>
<div id="app" style="display:none">
  <div class="progress-bar">
    <div class="progress-text"><span>Itens preenchidos</span><span id="progTexto">0 / 0</span></div>
    <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  </div>
  <div class="quem-box" id="quemDiv"><h3>📋 Já preencheram hoje:</h3><div id="tagsList"></div></div>
  <div class="sync-info" id="syncInfo"></div>
  <div id="listContainer"></div>
  <button class="btn-salvar" onclick="salvar()">💾 Salvar meu checklist</button>
  <button class="btn-lista" onclick="gerarLista()">🛒 Ver lista de compras</button>
  <button class="btn-reset" onclick="resetar()">🔄 Resetar dia</button>
  <div class="lista-compras" id="listaCompras">
    <h2>🛒 Lista de Compras — o que está faltando</h2>
    <div id="listaItens"></div>
  </div>
</div>
<script>
const STORAGE_KEY = 'checklist2_dicasa_' + new Date().toISOString().slice(0,10);
let nomeAtual = localStorage.getItem('colab_nome') || '';
let dados = {};
const grupos = [
  {nome:'🧀 Queijos',itens:[
    {id:'mussarela',n:'Muçarela ralada',unit:'kg',min:5},
    {id:'parmesao',n:'Parmesão ralado',unit:'kg',min:1},
    {id:'provolone',n:'Provolone ralado',unit:'kg',min:0.5},
    {id:'gorgonzola',n:'Gorgonzola',unit:'kg',min:0.5},
    {id:'cheddar',n:'Cheddar fatiado',unit:'kg',min:0.5},
    {id:'catupiry',n:'Catupiry',unit:'kg',min:1},
    {id:'creamcheese',n:'Cream cheese',unit:'kg',min:1},
  ]},
  {nome:'🥩 Carnes',itens:[
    {id:'calabresa',n:'Calabresa fatiada',unit:'kg',min:3},
    {id:'presunto',n:'Presunto fatiado',unit:'kg',min:2},
    {id:'bacon',n:'Bacon picado',unit:'kg',min:1},
    {id:'frango',n:'Frango desfiado',unit:'kg',min:3},
    {id:'lombinho',n:'Lombinho fatiado',unit:'kg',min:2},
    {id:'cupim',n:'Cupim cozido',unit:'kg',min:2},
    {id:'alcatra',n:'Alcatra grelhada',unit:'kg',min:2},
    {id:'costela',n:'Costela desfiada',unit:'kg',min:2},
    {id:'pernil',n:'Pernil desfiado',unit:'kg',min:2},
  ]},
  {nome:'🥗 Vegetais',itens:[
    {id:'cebola',n:'Cebola fatiada',unit:'kg',min:2},
    {id:'tomate',n:'Tomate fatiado',unit:'kg',min:2},
    {id:'milho',n:'Milho',unit:'kg',min:1},
    {id:'palmito',n:'Palmito fatiado',unit:'kg',min:0.5},
    {id:'azeitona',n:'Azeitona',unit:'kg',min:0.5},
    {id:'tomateSeco',n:'Tomate seco',unit:'kg',min:0.3},
  ]},
  {nome:'🍯 Molhos',itens:[
    {id:'molhoTomate',n:'Molho de tomate',unit:'kg',min:5},
    {id:'barbecue',n:'Molho barbecue',unit:'g',min:500},
    {id:'cremeAlho',n:'Creme de alho',unit:'g',min:300},
    {id:'cremeMandioca',n:'Creme de mandioca',unit:'kg',min:1},
    {id:'cremeLeite',n:'Creme de leite',unit:'g',min:300},
    {id:'molhoMadeira',n:'Molho madeira',unit:'g',min:300},
  ]},
  {nome:'🍌 Doces',itens:[
    {id:'morango',n:'Morango',unit:'kg',min:1},
    {id:'banana',n:'Banana fatiada',unit:'kg',min:1},
    {id:'chocLeite',n:'Chocolate ao leite',unit:'kg',min:1},
    {id:'chocBranco',n:'Chocolate branco',unit:'kg',min:1},
    {id:'coco',n:'Coco ralado',unit:'kg',min:0.3},
    {id:'leiteCond',n:'Leite condensado',unit:'g',min:500},
  ]},
  {nome:'📦 Outros',itens:[
    {id:'batatapalha',n:'Batata palha',unit:'kg',min:1},
  ]},
];
function confirmarNome(){
  const v=document.getElementById('nomeInput').value.trim();if(!v)return;
  nomeAtual=v;localStorage.setItem('colab_nome',v);
  document.getElementById('nomeInput').disabled=true;
  document.getElementById('app').style.display='block';
  renderForm();carregarDados();setInterval(carregarDados,30000);
}
function renderForm(){
  const c=document.getElementById('listContainer');c.innerHTML='';
  grupos.forEach(g=>{
    let h='<div class="secao"><div class="secao-titulo">'+g.nome+'</div>';
    g.itens.forEach(it=>{
      const step=it.unit==='kg'?'0.5':'100';
      const delta=it.unit==='kg'?0.5:100;
      h+=`<div class="item" id="item_${it.id}">
        <div class="item-info">
          <div class="item-nome">${it.n}</div>
          <div id="por_${it.id}" class="item-por"></div>
        </div>
        <div class="qty-box">
          <button class="qty-btn" onclick="adj('${it.id}',-${delta})">−</button>
          <input class="qty-input" type="number" id="qty_${it.id}" value="0" min="0" step="${step}">
          <span class="qty-unit">${it.unit}</span>
          <button class="qty-btn" onclick="adj('${it.id}',${delta})">+</button>
        </div>
      </div>`;
    });
    c.innerHTML+=h+'</div>';
  });
}
function adj(id,d){
  const inp=document.getElementById('qty_'+id);
  const v=Math.max(0,parseFloat(inp.value||0)+d);
  inp.value=v%1===0?v:v.toFixed(1);
}
async function carregarDados(){
  try{
    const r=await window.storage.get(STORAGE_KEY,true);
    dados=r&&r.value?JSON.parse(r.value):{respostas:{}};
  }catch(e){dados={respostas:{}};}
  // Preenche campos do usuário
  const meus=dados.respostas&&dados.respostas[nomeAtual];
  if(meus) grupos.forEach(g=>g.itens.forEach(it=>{
    const inp=document.getElementById('qty_'+it.id);
    if(inp&&meus[it.id]!==undefined)inp.value=meus[it.id];
  }));
  atualizarUI();
  document.getElementById('syncInfo').textContent='Sync: '+new Date().toLocaleTimeString('pt-BR');
}
function atualizarUI(){
  const resp=dados.respostas||{};
  const cols=Object.keys(resp);
  if(cols.length){
    document.getElementById('quemDiv').style.display='block';
    document.getElementById('tagsList').innerHTML=cols.map(n=>'<span class="tag">✅ '+n+'</span>').join('');
  } else {
    document.getElementById('quemDiv').style.display='block';
    document.getElementById('tagsList').innerHTML='<span style="color:#ff6b35;font-size:0.8rem">⚠️ Ninguém preencheu ainda hoje. Seja o primeiro!</span>';
  }
  let total=0,prench=0;
  grupos.forEach(g=>g.itens.forEach(it=>{
    total++;
    const quem=cols.filter(c=>parseFloat(resp[c][it.id]||0)>0);
    const itemEl=document.getElementById('item_'+it.id);
    const porEl=document.getElementById('por_'+it.id);
    if(quem.length){
      prench++;
      itemEl.className='item ok';
      porEl.textContent='✓ '+quem.join(', ');
    }else{
      itemEl.className='item';
      porEl.textContent='';
    }
  }));
  document.getElementById('progTexto').textContent=prench+' / '+total;
  document.getElementById('barFill').style.width=Math.round(prench/total*100)+'%';
}
async function salvar(){
  if(!dados.respostas)dados.respostas={};
  const meus={};
  grupos.forEach(g=>g.itens.forEach(it=>{
    const inp=document.getElementById('qty_'+it.id);
    meus[it.id]=parseFloat(inp?inp.value:0)||0;
  }));
  meus._hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  dados.respostas[nomeAtual]=meus;
  try{
    await window.storage.set(STORAGE_KEY,JSON.stringify(dados),true);
    atualizarUI();alert('✅ Salvo!');
  }catch(e){alert('Erro: '+e.message);}
}
function gerarLista(){
  const resp=dados.respostas||{};
  const cols=Object.keys(resp);
  const falt=[];
  grupos.forEach(g=>g.itens.forEach(it=>{
    let soma=0;cols.forEach(c=>{soma+=parseFloat(resp[c][it.id]||0);});
    if(soma<it.min){falt.push({n:it.n,soma,min:it.min,falta:it.min-soma,unit:it.unit});}
  }));
  const el=document.getElementById('listaItens');
  if(!falt.length){el.innerHTML='<p style="color:#00cc66;text-align:center;padding:12px">✅ Tudo ok!</p>';}
  else{el.innerHTML=falt.map(f=>`<div class="lista-item"><span>${f.n} <span style="color:#555;font-size:0.72rem">(tem ${f.soma}${f.unit})</span></span><span class="lista-qtd">+${f.falta.toFixed(f.unit==="kg"?1:0)} ${f.unit}</span></div>`).join('');}
  document.getElementById('listaCompras').style.display='block';
  document.getElementById('listaCompras').scrollIntoView({behavior:'smooth'});
}
async function resetar(){
  if(!confirm('Resetar checklist de hoje?'))return;
  dados={respostas:{}};
  await window.storage.set(STORAGE_KEY,JSON.stringify(dados),true);
  renderForm();atualizarUI();
  document.getElementById('quemDiv').style.display='none';
  document.getElementById('listaCompras').style.display='none';
}
if(nomeAtual){
  document.getElementById('nomeInput').value=nomeAtual;
  document.getElementById('nomeInput').disabled=true;
  document.getElementById('app').style.display='block';
  renderForm();carregarDados();setInterval(carregarDados,30000);
}
</script>
</body>
</html>
