<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#060c1a"/>
<title>GestãoERP — Sistema Completo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#060c1a;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;}
input,select,button,textarea{font-family:inherit;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes bounce{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spin{animation:spin 0.8s linear infinite;}
.pulse{animation:pulse 1.5s ease-in-out infinite;}

.tela{display:none;min-height:100vh;}
.tela.ativa{display:block;}

/* MENU */
.menu-card{border-radius:20px;padding:18px;border:1px solid;display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:10px;transition:transform 0.12s;-webkit-user-select:none;user-select:none;touch-action:manipulation;width:100%;text-align:left;background:none;font-family:inherit;}
.menu-card:active{transform:scale(0.97);}
.menu-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.menu-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700;margin-top:4px;}

/* HEADER */
.mod-header{position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px);background:rgba(6,12,26,0.96);}
.btn-back{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.6);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;}
.mod-body{padding:16px 16px 90px;}

/* TABS */
.tabs-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.tab-btn{flex-shrink:0;padding:8px 13px;border-radius:11px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}

/* LOGIN */
.perfil-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px;}
.perfil-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);cursor:pointer;text-align:left;transition:transform 0.1s;}
.perfil-btn:active{transform:scale(0.95);}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:24px 0;}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);transition:all 0.15s;}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px;}
.key{height:58px;border-radius:15px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.key:active{transform:scale(0.92);}
.campo-r{background:rgba(255,255,255,0.05);border-radius:10px;padding:9px 12px;}
.campo-l{font-size:10px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px;}
.btn-acao-ia{padding:11px 8px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.65);font-size:12px;font-weight:600;cursor:pointer;text-align:center;width:100%;}
.btn-acao-ia:active{transform:scale(0.96);}

/* CHECKLIST */
.turno-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.turno-card{padding:10px 4px;border-radius:14px;text-align:center;cursor:pointer;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);transition:all 0.15s;}
.turno-card.ativo{border-color:#6366f1;background:rgba(99,102,241,0.18);}
.tarefa{display:flex;align-items:flex-start;gap:11px;padding:13px;border-radius:15px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);margin-bottom:7px;cursor:pointer;transition:all 0.12s;}
.tarefa.feita{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);}
.tarefa:active{transform:scale(0.98);}
.check-box{width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;}
.check-box.ok{background:#10b981;border-color:#10b981;}
.barra{height:8px;background:rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;margin:5px 0;}
.barra-fill{height:100%;border-radius:8px;transition:width 0.4s;}

/* PEDIDO */
.mesa-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px;}
.mesa-btn{height:42px;border-radius:11px;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.12s;}
.mesa-btn:active{transform:scale(0.9);}
.item-card{display:flex;align-items:center;gap:11px;padding:11px;border-radius:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);margin-bottom:6px;cursor:pointer;transition:all 0.12s;}
.item-card:active{transform:scale(0.98);}
.item-ck{width:21px;height:21px;border-radius:6px;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}

/* FOTO / MANUAL */
.upload-label{display:block;cursor:pointer;margin-bottom:10px;}
.upload-box{padding:26px 16px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border:3px solid;}
.cam-label{display:block;cursor:pointer;margin-bottom:14px;}
.cam-box{padding:13px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);}
.campo{margin-bottom:10px;}
.campo label{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:4px;}
.campo input,.campo textarea,.campo select{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 12px;color:#fff;font-size:13px;outline:none;resize:vertical;}
.campo textarea{min-height:80px;}
.btn-main{width:100%;padding:14px;border-radius:14px;border:none;color:#000;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px;transition:opacity 0.12s;}
.btn-main:active{opacity:0.8;}
.btn-main:disabled{opacity:0.35;cursor:default;}
.btn-sec{width:100%;padding:11px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.45);font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.kpi{border-radius:14px;padding:13px;}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:10px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px);background:rgba(6,12,26,0.97);}
.nav-row{display:flex;justify-content:space-around;padding:5px 0 10px;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:none;background:none;cursor:pointer;transition:color 0.12s;}
.nav-icon{font-size:21px;line-height:1;}
.nav-lbl{font-size:10px;line-height:1;}
</style>
</head>
<body>

<!-- ══ MENU ══ -->
<div id="t-menu" class="tela ativa">
  <div style="background:linear-gradient(160deg,#0a1025,#060c1a);padding:0 16px 24px;">
    <div style="text-align:center;padding:36px 0 20px;">
      <div style="width:68px;height:68px;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,#6366f1,#06b6d4);box-shadow:0 8px 28px rgba(99,102,241,0.4);">🏭</div>
      <p style="font-size:24px;font-weight:800;">GestãoERP</p>
      <p style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;">Sistema Integrado · 5 Segmentos</p>
    </div>

    <button class="menu-card" style="border-color:rgba(99,102,241,0.35);background:rgba(99,102,241,0.08);" onclick="abrirModulo('sistema')">
      <div class="menu-icon" style="background:rgba(99,102,241,0.2);">📱</div>
      <div>
        <p style="font-size:15px;font-weight:700;">Sistema da Equipe</p>
        <p style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:2px;">Login PIN · Checklists · Pedidos · Vendas · Delivery</p>
        <div class="menu-badge" style="background:rgba(99,102,241,0.2);color:#a5b4fc;">14 perfis · 3 turnos</div>
      </div>
    </button>

    <button class="menu-card" style="border-color:rgba(6,182,212,0.35);background:rgba(6,182,212,0.08);" onclick="abrirModulo('foto')">
      <div class="menu-icon" style="background:rgba(6,182,212,0.2);">📸</div>
      <div>
        <p style="font-size:15px;font-weight:700;">Lançamento por Foto</p>
        <p style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:2px;">NF · PIX/Boleto · Balança · Câmera · Cheque</p>
        <div class="menu-badge" style="background:rgba(6,182,212,0.2);color:#67e8f9;">📸 foto + formulário manual</div>
      </div>
    </button>

    <button class="menu-card" style="border-color:rgba(16,185,129,0.35);background:rgba(16,185,129,0.08);" onclick="abrirModulo('guia')">
      <div class="menu-icon" style="background:rgba(16,185,129,0.2);">🚀</div>
      <div>
        <p style="font-size:15px;font-weight:700;">Guia de Implantação</p>
        <p style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:2px;">Publicar no Netlify e conectar toda a equipe</p>
        <div class="menu-badge" style="background:rgba(16,185,129,0.2);color:#34d399;">Windows · ~15 min · grátis</div>
      </div>
    </button>

    <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px;margin-top:4px;">
      <p style="font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">PINs para testar agora</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">
        <p style="font-size:13px;color:rgba(255,255,255,0.5);">👑 Proprietário <span style="color:#6366f1;font-family:monospace;font-weight:700;float:right;">1234</span></p>
        <p style="font-size:13px;color:rgba(255,255,255,0.5);">🍺 Garçom Bar <span style="color:#06b6d4;font-family:monospace;font-weight:700;float:right;">1111</span></p>
        <p style="font-size:13px;color:rgba(255,255,255,0.5);">🤝 Sócio <span style="color:#8b5cf6;font-family:monospace;font-weight:700;float:right;">5678</span></p>
        <p style="font-size:13px;color:rgba(255,255,255,0.5);">🔥 Churrasqueiro <span style="color:#f97316;font-family:monospace;font-weight:700;float:right;">7777</span></p>
      </div>
    </div>
  </div>
</div>

<!-- ══ SISTEMA DA EQUIPE ══ -->
<div id="t-sistema" class="tela">
  <!-- LOGIN -->
  <div id="v-login" style="min-height:100vh;background:#060c1a;overflow-y:auto;">
    <div style="padding:24px 16px 12px;text-align:center;">
      <div style="width:52px;height:52px;border-radius:16px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#6366f1,#06b6d4);">🏭</div>
      <p style="font-weight:800;font-size:18px;">GestãoERP</p>
      <p style="font-size:12px;color:rgba(255,255,255,0.35);margin-top:3px;">Selecione seu perfil</p>
    </div>
    <div style="padding:0 16px 10px;"><button onclick="voltarMenu()" style="background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.4);padding:7px 14px;border-radius:9px;font-size:12px;cursor:pointer;">← Menu</button></div>
    <div id="perfis-wrap" class="perfil-grid"></div>
  </div>
  <!-- PIN -->
  <div id="v-pin" style="display:none;min-height:100vh;background:#060c1a;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;">
    <button onclick="voltarPerfis()" style="position:absolute;top:20px;left:20px;background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.4);padding:7px 13px;border-radius:9px;font-size:12px;cursor:pointer;">← Voltar</button>
    <div id="pin-icone" style="width:68px;height:68px;border-radius:20px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:34px;"></div>
    <p id="pin-nome" style="font-weight:800;font-size:18px;text-align:center;"></p>
    <p id="pin-hint" style="font-size:13px;color:rgba(255,255,255,0.35);margin:6px 0 0;text-align:center;"></p>
    <div class="pin-dots" id="pin-dots"><div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div><div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div></div>
    <p id="pin-erro" style="color:#f87171;font-weight:600;font-size:13px;min-height:18px;text-align:center;margin-bottom:12px;"></p>
    <div class="teclado">
      <button class="key" onclick="dig('1')">1</button><button class="key" onclick="dig('2')">2</button><button class="key" onclick="dig('3')">3</button>
      <button class="key" onclick="dig('4')">4</button><button class="key" onclick="dig('5')">5</button><button class="key" onclick="dig('6')">6</button>
      <button class="key" onclick="dig('7')">7</button><button class="key" onclick="dig('8')">8</button><button class="key" onclick="dig('9')">9</button>
      <button class="key" style="opacity:0;pointer-events:none;"></button><button class="key" onclick="dig('0')">0</button>
      <button class="key" style="background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);" onclick="apagar()">⌫</button>
    </div>
  </div>
  <!-- APP -->
  <div id="v-app" style="display:none;">
    <div class="mod-header">
      <div id="app-icon" style="width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;"></div>
      <div style="flex:1;"><p id="app-nome" style="font-weight:700;font-size:13px;line-height:1;"></p><p id="app-sub" style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px;"></p></div>
      <span id="app-hora" style="font-size:11px;color:rgba(255,255,255,0.3);"></span>
      <button onclick="sair()" style="background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.4);padding:5px 10px;border-radius:7px;font-size:11px;cursor:pointer;margin-left:6px;">Sair</button>
    </div>
    <div class="mod-body" id="app-body"></div>
    <div class="bottom-nav" id="app-nav"></div>
  </div>
</div>

<!-- ══ LANÇAMENTO POR FOTO ══ -->
<div id="t-foto" class="tela">

<script>
// ═══ DADOS ═══════════════════════════════════════════════════════════════════
const uid   = ()=>Math.random().toString(36).slice(2,9);
const today = ()=>new Date().toISOString().split("T")[0];
const hora  = ()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const brl   = v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fdt   = s=>{try{return s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"—";}catch{return s||"—";}};

const SEGS=[
  {id:"restaurante", label:"Restaurante", icon:"🍽️",color:"#f59e0b"},
  {id:"hamburgueria",label:"Hamburgueria",icon:"🍔",color:"#ef4444"},
  {id:"espetaria",   label:"Espetaria",   icon:"🍢",color:"#f97316"},
  {id:"pizzaria",    label:"Pizzaria",    icon:"🍕",color:"#ec4899"},
  {id:"bar",         label:"Bar",         icon:"🍺",color:"#06b6d4"},
];
const SEG=Object.fromEntries(SEGS.map(s=>[s.id,s]));

const TURNOS=[
  {id:"manha",label:"Manhã",icon:"🌅",horas:"07h–14h"},
  {id:"tarde",label:"Tarde",icon:"☀️",horas:"14h–21h"},
  {id:"noite",label:"Noite",icon:"🌙",horas:"21h–07h"},
];

const PERFIS=[
  {id:"owner1",nome:"Proprietário",  icon:"👑",pin:"1234",nivel:"owner",  seg:null,          fn:"gestao",       cor:"#6366f1"},
  {id:"owner2",nome:"Sócio",         icon:"🤝",pin:"5678",nivel:"owner",  seg:null,          fn:"gestao",       cor:"#8b5cf6"},
  {id:"ger01", nome:"Gerente",       icon:"📋",pin:"0001",nivel:"gerente",seg:null,          fn:"gerencia",     cor:"#10b981"},
  {id:"cx01",  nome:"Caixa",         icon:"💰",pin:"0002",nivel:"gerente",seg:null,          fn:"caixa",        cor:"#10b981"},
  {id:"gar01", nome:"Garçom Bar",    icon:"🍺",pin:"1111",nivel:"func",   seg:"bar",         fn:"garcom",       cor:"#06b6d4"},
  {id:"gar02", nome:"Garçom Rest.",  icon:"🍽️",pin:"2222",nivel:"func",   seg:"restaurante", fn:"garcom",       cor:"#f59e0b"},
  {id:"gar03", nome:"Garçom Pizza",  icon:"🍕",pin:"3333",nivel:"func",   seg:"pizzaria",    fn:"garcom",       cor:"#ec4899"},
  {id:"gar04", nome:"Garçom Lanch.", icon:"🍔",pin:"4444",nivel:"func",   seg:"hamburgueria",fn:"garcom",       cor:"#ef4444"},
  {id:"coz01", nome:"Cozinha",       icon:"👨‍🍳",pin:"5555",nivel:"func",   seg:"restaurante", fn:"cozinha",      cor:"#f59e0b"},
  {id:"chur01",nome:"Churrasqueiro", icon:"🔥",pin:"7777",nivel:"func",   seg:"espetaria",   fn:"churrasqueiro",cor:"#f97316"},
  {id:"piz01", nome:"Pizzaiolo",     icon:"🍕",pin:"8888",nivel:"func",   seg:"pizzaria",    fn:"pizzaiolo",    cor:"#ec4899"},
  {id:"lan01", nome:"Lanches",       icon:"🍔",pin:"9999",nivel:"func",   seg:"hamburgueria",fn:"lanchas",      cor:"#ef4444"},
  {id:"bar01", nome:"Barman",        icon:"🍹",pin:"1010",nivel:"func",   seg:"bar",         fn:"barman",       cor:"#06b6d4"},
  {id:"lmp01", nome:"Limpeza",       icon:"🧹",pin:"2020",nivel:"func",   seg:null,          fn:"limpeza",      cor:"#9ca3af"},
];

const API_URL = "https://api.anthropic.com/v1/messages";

async function analisarImagem(b64, mime, system, user) {
  const r = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":API_KEY,"anthropic-version":"2023-06-01"},
    body: JSON.stringify({model:MODEL,max_tokens:1200,system,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime,data:b64}},{type:"text",text:user}]}]})
  });
  if(!r.ok) throw new Error("API erro "+r.status);
  const d=await r.json();
  const txt=(d.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();
  try{return JSON.parse(txt);}catch{return {_raw:txt};}
}

function selecionarPerfil(p){
  perfilSel=p;pinAtual="";

  document.getElementById("pin-icone").style.background=p.cor+"22";

}

function dig(d){
  if(pinAtual.length>=4)return;
  pinAtual+=d;atualizarDots();
  if(pinAtual.length===4)setTimeout(()=>{
    if(perfilSel?.pin===pinAtual){entrar(perfilSel);}
    else{document.getElementById("pin-erro").textContent="PIN incorreto";document.getElementById("v-pin").style.animation="bounce 0.5s";setTimeout(()=>{pinAtual="";atualizarDots();document.getElementById("pin-erro").textContent="";},800);}
  },120);
}
function apagar(){if(pinAtual.length>0){pinAtual=pinAtual.slice(0,-1);atualizarDots();}}
function atualizarDots(){
  [0,1,2,3].forEach(i=>{const d=document.getElementById("d"+i);if(!d)return;if(i<pinAtual.length){d.style.background=perfilSel?.cor||"#6366f1";d.style.borderColor=perfilSel?.cor||"#6366f1";d.style.transform="scale(1.2)";}else{d.style.background="transparent";d.style.borderColor="rgba(255,255,255,0.2)";d.style.transform="scale(1)";}});
}

  pagina=pg;

  const nb=document.getElementById("nb-"+pg);if(nb&&usuario)nb.style.color=usuario.cor;

  if(pg==="home")body.innerHTML=renderHome();
  else if(pg==="checklist")body.innerHTML=renderChecklist();
  else if(pg==="pedido")body.innerHTML=renderPedido();
  else if(pg==="vendas")body.innerHTML=renderVendas();

  </div>`;
  if(!isOwner&&total>0){
    h+=`<div class="card">`;
    TURNOS.forEach(t=>{const ts=tar[t.id]||[];const d=ts.filter((_,i)=>checks[`${today()}_${f}_${t.id}_${i}`]).length;h+=`<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span style="color:rgba(255,255,255,0.6);">${t.icon} ${t.label} <span style="color:rgba(255,255,255,0.3);font-size:10px;">${t.horas}</span></span><span style="color:${d===ts.length&&ts.length>0?"#10b981":"rgba(255,255,255,0.5)"};">${d}/${ts.length}</span></div><div class="barra"><div class="barra-fill" style="width:${ts.length>0?(d/ts.length)*100:0}%;background:${u.cor};"></div></div></div>`;});

    h+=`<div class="kpi2"><div class="kpi" style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.28);"><p style="font-size:10px;color:rgba(99,102,241,0.8);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Pedidos hoje</p><p style="font-size:20px;font-weight:800;">${hoje.length}</p></div><div class="kpi" style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.28);"><p style="font-size:10px;color:rgba(16,185,129,0.8);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Faturamento</p><p style="font-size:16px;font-weight:800;">${brl(hoje.reduce((a,p)=>a+p.total,0))}</p></div></div>`;
    h+=`<div class="card"><p style="font-weight:700;font-size:13px;margin-bottom:10px;">👥 Progresso da Equipe</p>`;
    Object.entries(TAREFAS).forEach(([f2,tns])=>{
      const tot=TURNOS.reduce((a,t)=>(tns[t.id]||[]).length+a,0);
      const fei=TURNOS.reduce((a,t)=>{const ts=tns[t.id]||[];return a+ts.filter((_,i)=>checks[`${today()}_${f2}_${t.id}_${i}`]).length;},0);

    });
    h+=`</div>`;
  }
  if(!isOwner){
    const pend=TURNOS.flatMap(t=>(tar[t.id]||[]).map((tk,i)=>({tk,t,done:checks[`${today()}_${f}_${t.id}_${i}`]}))).filter(x=>!x.done).slice(0,4);

function renderChecklist(){
  const u=usuario,isOwner=u.nivel==="owner"||u.nivel==="gerente";
  const funcs=isOwner?Object.keys(TAREFAS):[u.fn];
  let h="";
  if(isOwner){h+=`<div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;">`;funcs.forEach(f=>{h+=`<button onclick="cfFn='${f}';navPara('checklist')" style="flex-shrink:0;padding:6px 11px;border-radius:9px;background:${f===cfFn?"rgba(99,102,241,0.3)":"rgba(255,255,255,0.06)"};border:1px solid ${f===cfFn?"rgba(99,102,241,0.5)":"transparent"};color:${f===cfFn?"#a5b4fc":"rgba(255,255,255,0.45)"};font-size:11px;font-weight:700;text-transform:capitalize;cursor:pointer;">${f}</button>`;});h+=`</div>`;}
  const tar=TAREFAS[cfFn]||{};
  h+=`<div class="turno-grid">`;
  TURNOS.forEach(t=>{const ts=tar[t.id]||[];const d=ts.filter((_,i)=>checks[`${today()}_${cfFn}_${t.id}_${i}`]).length;const full=ts.length>0&&d===ts.length;h+=`<div class="turno-card${t.id===cfTab?" ativo":""}" onclick="cfTab='${t.id}';navPara('checklist')"><div style="font-size:19px;">${t.icon}</div><div style="font-weight:700;font-size:12px;color:#fff;">${t.label}</div><div style="font-size:9px;color:rgba(255,255,255,0.35);">${t.horas}</div><div style="font-size:11px;font-weight:700;margin-top:3px;color:${full?"#10b981":t.id===cfTab?"#a5b4fc":"rgba(255,255,255,0.35)"};">${d}/${ts.length}</div></div>`;});
  h+=`</div>`;
  const lista=tar[cfTab]||[];const feito=lista.filter((_,i)=>checks[`${today()}_${cfFn}_${cfTab}_${i}`]).length;const prog=lista.length>0?Math.round((feito/lista.length)*100):0;const cor=prog===100?"#10b981":prog>60?"#f59e0b":"#6366f1";
  h+=`<div class="card" style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;margin-bottom:7px;"><span style="font-weight:700;font-size:13px;text-transform:capitalize;">${cfFn} · ${TURNOS.find(t=>t.id===cfTab)?.label}</span><span style="font-weight:700;color:${cor};">${feito}/${lista.length}</span></div><div class="barra"><div class="barra-fill" style="width:${prog}%;background:${prog===100?"#10b981":cor};height:10px;"></div></div>${prog===100&&lista.length>0?`<p style="color:#10b981;text-align:center;font-weight:700;margin-top:8px;font-size:13px;">🎉 Turno concluído!</p>`:""}</div>`;
  lista.forEach((t,i)=>{const done=!!checks[`${today()}_${cfFn}_${cfTab}_${i}`];h+=`<div class="tarefa${done?" feita":""}" onclick="toggleCheck('${cfFn}','${cfTab}',${i})"><div class="check-box${done?" ok":""}">${done?"✓":""}</div><span style="font-size:12px;line-height:1.4;${done?"text-decoration:line-through;color:rgba(255,255,255,0.35);":"color:rgba(255,255,255,0.88);"}">${t}</span>${done?`<span style="margin-left:auto;font-size:10px;color:#10b981;flex-shrink:0;">${hora()}</span>`:""}</div>`;});
  h+=`<div style="display:flex;gap:7px;margin-top:8px;"><input id="nova-tar" placeholder="+ Tarefa personalizada…" style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:11px;padding:11px 13px;color:#fff;font-size:12px;outline:none;"/><button onclick="addTarefa()" style="padding:11px 15px;border-radius:11px;background:#6366f1;border:none;color:#fff;font-weight:700;font-size:17px;cursor:pointer;">+</button></div>`;
  return h;
}
function toggleCheck(f,t,i){const k=`${today()}_${f}_${t}_${i}`;checks[k]=!checks[k];salvarChecks();navPara("checklist");}
function addTarefa(){const inp=document.getElementById("nova-tar");if(!inp||!inp.value.trim())return;if(!TAREFAS[cfFn])TAREFAS[cfFn]={};if(!TAREFAS[cfFn][cfTab])TAREFAS[cfFn][cfTab]=[];TAREFAS[cfFn][cfTab].push(inp.value.trim());navPara("checklist");}

function renderPedido(){
  const u=usuario,seg=u.seg||"restaurante",cor=SEG[seg]?.color||"#6366f1",card=CARDAPIO[seg]||[];
  const total=pedItens.reduce((a,i)=>a+i.p*i.qtd,0);
  let h=`<p style="font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;">Mesa</p><div class="mesa-grid">`;
  for(let i=1;i<=15;i++)h+=`<button class="mesa-btn${pedMesa===String(i)?" ":" "}" style="${pedMesa===String(i)?`background:${cor}40;color:${cor};border-color:${cor};`:""}" onclick="selMesa('${i}')">${i}</button>`;
  h+=`</div><p style="font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;">${SEG[seg].icon} ${SEG[seg].label}</p>`;
  card.forEach(item=>{const sel=pedItens.find(i=>i.n===item.n);h+=`<div class="item-card" style="${sel?`background:${cor}18;border-color:${cor}45;`:""}" onclick="toggleItem('${item.n}',${item.p})"><div class="item-ck" style="${sel?`background:${cor};border-color:${cor};`:""}">${sel?"✓":""}</div><span style="flex:1;font-size:13px;">${item.n}</span><span style="color:rgba(255,255,255,0.4);font-size:11px;">${brl(item.p)}</span>${sel?`<div onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:5px;margin-left:4px;"><button onclick="chgQtd('${item.n}',-1)" style="width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;">−</button><span style="font-weight:700;width:16px;text-align:center;font-size:14px;">${sel.qtd}</span><button onclick="chgQtd('${item.n}',1)" style="width:26px;height:26px;border-radius:7px;background:${cor};border:none;color:#000;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button></div>`:""}</div>`;});
  h+=`<button onclick="vozPedido('${seg}')" style="width:100%;padding:13px;border-radius:14px;border:2px solid ${cor}50;background:${cor}10;color:${cor};font-weight:700;font-size:13px;cursor:pointer;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:8px;">🎙️ Falar pedido por voz</button>`;
  h+=`<input id="obs-ped" placeholder="Observação (sem cebola, bem passado…)" style="width:100%;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:12px;outline:none;margin-bottom:10px;"/>`;
  if(pedItens.length>0){h+=`<div class="card" style="margin-bottom:10px;">`;pedItens.forEach(it=>{h+=`<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;"><span style="color:rgba(255,255,255,0.7);">${it.qtd}× ${it.n}</span><span style="font-weight:600;">${brl(it.p*it.qtd)}</span></div>`;});h+=`<div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:7px;margin-top:3px;"><span style="color:rgba(255,255,255,0.6);">Mesa ${pedMesa||"?"}</span><span>${brl(total)}</span></div></div>`;}
  h+=`<button id="btn-env" onclick="enviarPedido()" ${!pedMesa||!pedItens.length?"disabled":""} class="btn-main" style="background:${!pedMesa||!pedItens.length?"#374151":cor};">⚡ Enviar — Mesa ${pedMesa||"?"} · ${brl(total)}</button>`;
  return h;
}
function selMesa(m){pedMesa=m;navPara("pedido");}
function toggleItem(n,p){const idx=pedItens.findIndex(i=>i.n===n);if(idx>=0)pedItens.splice(idx,1);else pedItens.push({n,p,qtd:1});navPara("pedido");}
function chgQtd(n,d){const it=pedItens.find(i=>i.n===n);if(it){it.qtd=Math.max(1,it.qtd+d);navPara("pedido");}}
function enviarPedido(){
  if(!pedMesa||!pedItens.length)return;
  const p={id:uid(),data:today(),hora:hora(),mesa:parseInt(pedMesa),segmento:usuario.seg||"restaurante",segmento_label:SEG[usuario.seg||"restaurante"].label,operador:usuario.nome,itens:pedItens.map(i=>({nome:i.n,qtd:i.qtd,preco:i.p,total:i.p*i.qtd})),total:pedItens.reduce((a,i)=>a+i.p*i.qtd,0)};
  pedidos.unshift(p);salvarPedidos();
  const btn=document.getElementById("btn-env");if(btn){btn.textContent=`✅ Mesa ${pedMesa} enviada!`;btn.disabled=true;}
  setTimeout(()=>{pedItens=[];pedMesa="";navPara("pedido");},2500);
}
function vozPedido(seg){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Use Chrome para voz.");return;}
  const r=new SR();r.lang="pt-BR";r.continuous=false;r.interimResults=false;
  r.onresult=e=>{const txt=e.results[0][0].transcript.toLowerCase();(CARDAPIO[seg]||[]).forEach(item=>{if(txt.includes(item.n.toLowerCase().split(" ")[0])&&!pedItens.find(i=>i.n===item.n))pedItens.push({...item,qtd:1});});const m=txt.match(/mesa\s*(\d+)/i);if(m)pedMesa=m[1];navPara("pedido");};
  r.start();
}

function renderVendas(){
  const hoje=pedidos.filter(p=>p.data===today()),total=hoje.reduce((a,p)=>a+p.total,0);
  let h=`<div class="kpi" style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.28);margin-bottom:12px;border-radius:14px;"><p style="font-size:10px;color:rgba(16,185,129,0.8);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;">Faturamento hoje</p><p style="font-size:24px;font-weight:800;">${brl(total)}</p><p style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px;">${hoje.length} pedidos</p></div>`;
  SEGS.forEach(s=>{const ps=hoje.filter(p=>p.segmento===s.id);const fat=ps.reduce((a,p)=>a+p.total,0);if(!ps.length)return;h+=`<div class="card" style="border-color:${s.color}25;background:${s.color}08;"><div style="display:flex;justify-content:space-between;margin-bottom:5px;"><span style="color:${s.color};font-weight:700;">${s.icon} ${s.label}</span><span style="font-weight:700;">${brl(fat)}</span></div><div style="font-size:11px;color:rgba(255,255,255,0.4);display:flex;justify-content:space-between;margin-bottom:5px;"><span>${ps.length} pedidos</span><span>ticket ${brl(fat/ps.length)}</span></div><div class="barra"><div class="barra-fill" style="width:${total>0?(fat/total)*100:0}%;background:${s.color};height:4px;"></div></div>${ps.slice(0,3).map(p=>`<div style="display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.5);padding:4px 0;border-top:1px solid rgba(255,255,255,0.05);margin-top:4px;"><span>Mesa ${p.mesa} · ${p.hora}</span><span>${brl(p.total)}</span></div>`).join("")}</div>`;});
  if(!hoje.length)h+=`<p style="color:rgba(255,255,255,0.2);text-align:center;padding:48px 0;font-size:13px;">Nenhum pedido hoje ainda</p>`;
  return h;
}

    } else if(fotoTab==="balanca"){

    } else if(fotoTab==="cheque"){

        <div style="text-align:center;padding:12px 0;border-top:1px dashed rgba(255,255,255,0.15);border-bottom:1px dashed rgba(255,255,255,0.15);">
          <div style="font-size:34px;font-weight:800;font-family:monospace;color:#93c5fd;">${brl(d.valor_numerico)}</div>

      else rh+=`<input type="${cx.t}" id="f_${cx.id}" placeholder="${cx.ph||""}"/>`;
      rh+=`</div>`;
    });
    rh+=`<button onclick="confirmarLanc()" class="btn-main" style="background:${cfg.color};">✅ Confirmar Lançamento</button></div>`;

  if(fotoPreview) h+=`<img src="${fotoPreview}" style="width:100%;max-height:200px;object-fit:contain;border-radius:14px;background:#000;margin-bottom:12px;"/>`;

  h+=`<label style="display:block;margin-bottom:8px;cursor:pointer;">

    </div>
  </label>
  <label style="display:block;margin-bottom:12px;cursor:pointer;">

const PROMPTS={
  pix:{sys:`Você lê comprovantes bancários brasileiros. Responda APENAS em JSON: {"tipo":"pix","valor":0.00,"data":"YYYY-MM-DD","hora":"HH:MM","favorecido":"","banco_origem":"","banco_destino":"","chave_pix":"","id_transacao":"","observacao":"mensagem do pix","tipo_observacao":"vale/salario/freelancer/fornecedor/outros","status":"realizado","confianca":"alta","obs_leitura":""}`,usr:"Leia este comprovante bancário. Extraia especialmente valor, favorecido e observação/mensagem."},
  nf:{sys:`Você é OCR de notas fiscais brasileiras. Responda APENAS em JSON: {"numero":"","serie":"","fornecedor":"","cnpj":"","data_emissao":"YYYY-MM-DD","data_vencimento":"YYYY-MM-DD","valor_total":0.00,"itens":[{"descricao":"","quantidade":0,"unidade":"un","valor_unitario":0.00,"valor_total":0.00}],"confianca":"alta","obs_leitura":""}`,usr:"Leia esta nota fiscal brasileira e extraia todos os dados."},
  balanca:{sys:`Você lê balanças e identifica produtos. Responda APENAS em JSON: {"produto":"","peso_kg":0.000,"peso_display":"","tipo_balanca":"","confianca":"alta","obs_leitura":""}`,usr:"Identifique o produto e leia o peso exibido na balança."},
  camera:{sys:`Você conta estoque por imagem. Responda APENAS em JSON: {"ambiente":"","itens":[{"nome":"","quantidade_contada":0,"unidade":"un","obs":""}],"total_itens":0,"confianca":"alta","obs_leitura":""}`,usr:"Conte todos os produtos visíveis nesta imagem de estoque."},
  cheque:{sys:`Você lê cheques bancários brasileiros. Responda APENAS em JSON: {"banco":"","numero_cheque":"","valor_numerico":0.00,"valor_por_extenso":"","beneficiario":"","data":"YYYY-MM-DD","emitente":"","agencia":"","conta":"","confianca":"alta","obs_leitura":""}`,usr:"Leia este cheque bancário e extraia todos os campos visíveis."},
};

let iaResultado=null, iaProcessando=false;

function capturarFoto(input){
  const file=input?.files?.[0];if(!file)return;input.value="";
  const r=new FileReader();
  r.onload=async e=>{
    fotoPreview=e.target.result;
    fotoLancado=false;
    iaResultado=null;
    iaProcessando=true;
    renderFoto();
    // Animar loading
    const msgs=["Enviando para IA…","Analisando imagem…","Identificando campos…","Extraindo dados…"];
    let mi=0;
    const iv=setInterval(()=>{mi=(mi+1)%msgs.length;const el=document.getElementById("ia-msg");if(el)el.textContent=msgs[mi];},900);
    try{
      const b64=e.target.result.split(",")[1];
      const mime=file.type||"image/jpeg";
      const p=PROMPTS[fotoTab];
      const d=await analisarImagem(b64,mime,p.sys,p.usr);
      clearInterval(iv);
      iaResultado=d;
    }catch(err){
      clearInterval(iv);
      iaResultado={_erro:err.message||"Erro ao analisar"};
    }
    iaProcessando=false;
    renderFoto();
  };
  r.readAsDataURL(file);
}

function confirmarLanc(){
  const cfg=FOTO_CFG[fotoTab];
  for(const c of cfg.campos){
    if(c.req){const el=document.getElementById("f_"+c.id);if(!el||!el.value.trim()){el&&(el.style.borderColor="#ef4444");alert("Preencha: "+c.l);return;}}
  }
  const vals={};cfg.campos.forEach(c=>{const el=document.getElementById("f_"+c.id);if(el)vals[c.id]=el.value.trim();});
  const desc={
    pix:`⚡ PIX ${brl(vals.valor)} → ${vals.favorecido}${vals.observacao?" ("+vals.observacao+")":""}`,
    nf:`🧾 NF ${vals.numero||"S/N"} — ${vals.fornecedor} — ${brl(vals.valor_total)} — venc. ${vals.vencimento?fdt(vals.vencimento):"—"}`,
    balanca:`⚖️ ${vals.produto} — ${vals.peso} kg${vals.segmento?" → "+SEG[vals.segmento]?.label:""}`,
    camera:`📹 Contagem: ${(vals.itens||"").split("\n").slice(0,3).join(", ")}`,
    cheque:`🗒️ Cheque ${vals.numero||""} — ${brl(vals.valor)} — ${vals.beneficiario}`,
  }[fotoTab]||"Lançamento";
  lancamentos.unshift({id:uid(),data:today(),hora:hora(),tipo:fotoTab,desc,vals});
  salvarLanc();
  fotoLancado=true;renderFoto();
}

function lancarIA(desc){
  lancamentos.unshift({id:uid(),data:today(),hora:hora(),tipo:fotoTab,desc,ia:true});
  salvarLanc();
  fotoLancado=true; iaResultado=null; renderFoto();
}

function mudarTab(tab,el){
  fotoTab=tab;fotoPreview=null;fotoLancado=false;
  document.querySelectorAll("#foto-tabs .tab-btn").forEach(t=>{t.style.borderColor="rgba(255,255,255,0.1)";t.style.color="rgba(255,255,255,0.4)";t.classList.remove("ativo");});
  const cfg=FOTO_CFG[tab];el.style.borderColor=cfg.color;el.style.color=cfg.color;el.classList.add("ativo");
  renderFoto();
}
function resetFoto(){fotoPreview=null;fotoLancado=false;renderFoto();}

    <p style="font-weight:700;font-size:13px;margin-bottom:10px;">🔐 Todos os PINs</p>
