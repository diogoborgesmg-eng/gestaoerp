function rCompras(){
  const est=gest();const db=ldb();
  const criticos=est.filter(e=>e.min>0&&e.q<=e.min).map(e=>({...e,prio:1,label:"🚨 CRÍTICO"}));
  const baixos=est.filter(e=>e.min>0&&e.q>e.min&&e.q<=e.min*2).map(e=>({...e,prio:2,label:"⚠️ Baixo"}));
  const sem_min=est.filter(e=>(!e.min||e.min===0)&&e.q<5).map(e=>({...e,prio:3,label:"📌 Atenção"}));
  const lista=[...criticos,...baixos,...sem_min];
  const fornNotasSemana=db.contasPagar?.filter(c=>{
    const[d,m,y]=hj().split('/');
    const mesAtual=`${m}/${y}`;
    return!c.pago&&c.dt&&c.dt.slice(3)===mesAtual;
  })||[];

  // Agrupa por categoria
  const porCat={};
  lista.forEach(it=>{
    const cat=it.grupo?.grupo||detectarGrupo(it.n).grupo||"Outros";
    if(!porCat[cat])porCat[cat]=[];
    porCat[cat].push(it);
  });

  // Gera texto para WhatsApp
  function gerarTextoWpp(){
    let txt=`📋 *Lista de Compras — ${hj()}*\n\n`;
    Object.entries(porCat).forEach(([cat,itens])=>{
      txt+=`*${cat}:*\n`;
      itens.forEach(it=>{
        const falta=Math.max(0,(it.min||0)*3-it.q);
        txt+=`• ${it.n}: ${falta.toFixed(1)}${it.u}\n`;
      });
      txt+="\n";
    });
    txt+=`\n💰 Estimativa: ${brl(lista.reduce((a,it)=>a+Math.max(0,(it.min||0)*3-it.q)*(it.cu||0),0))}`;
    return encodeURIComponent(txt);
  }

  return`<div class="si">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
<span class="st">🛒 Lista de Compras</span>
<a href="https://wa.me/?text=${lista.length>0?gerarTextoWpp():""}" target="_blank"
style="padding:5px 12px;border-radius:8px;border:none;background:#25D366;color:#fff;font-size:11px;font-weight:700;text-decoration:none;${lista.length===0?"opacity:0.4;pointer-events:none;":""}">📤 WhatsApp</a>
</div>

${lista.length===0?`<div class="ial ag"><span>✅</span><span>Estoque ok! Nenhum item abaixo do mínimo.</span></div>`:""}

${Object.entries(porCat).map(([cat,itens])=>`
<p style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin:10px 0 5px;">${itens[0].grupo?.icone||"📋"} ${cat}</p>
${itens.map(it=>{
  const falta=Math.max(0,(it.min||0)*3-it.q);
  const estimativa=falta*(it.cu||0);
  return`<div class="card" style="margin-bottom:5px;border-color:${it.prio===1?"rgba(255,51,102,0.3)":it.prio===2?"rgba(255,204,0,0.3)":"var(--br)"};background:${it.prio===1?"rgba(255,51,102,0.05)":it.prio===2?"rgba(255,204,0,0.05)":"var(--sf)"};">
<div style="display:flex;justify-content:space-between;align-items:center;">
<div>
<span style="font-size:10px;font-weight:700;color:${it.prio===1?"var(--re)":it.prio===2?"var(--ye)":"var(--mu)"};">${it.label}</span>
<p style="font-size:13px;font-weight:700;">${it.n}</p>
<p style="font-size:10px;color:var(--mu);">Tem: ${it.q.toFixed(1)}${it.u} · Mín: ${(it.min||0)}${it.u}</p>
</div>
<div style="text-align:right;">
<p style="font-family:'Space Mono',monospace;font-size:16px;font-weight:700;">${falta.toFixed(1)}${it.u}</p>
<p style="font-size:10px;color:var(--ye);">≈ ${brl(estimativa)}</p>
</div>
</div>
</div>`;
}).join("")}`).join("")}

<div class="sep"></div>
<p style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:8px;">Contas a Pagar este Mês</p>
${fornNotasSemana.length===0?`<p style="font-size:12px;color:var(--mu);">Nenhuma conta pendente</p>`:
fornNotasSemana.map(c=>`<div class="item">
<div class="dot" style="background:#ff3366;"></div>
<div style="flex:1;"><div class="in">${c.forn}</div><div class="is">${c.pag} · Venc: ${c.venc||"—"}</div></div>

<div style="margin-top:10px;background:rgba(68,136,255,0.08);border:1px solid rgba(68,136,255,0.25);border-radius:10px;padding:11px;">
<p style="font-weight:700;font-size:12px;margin-bottom:5px;">💰 Estimativa Total</p>
<div style="display:flex;justify-content:space-between;font-size:12px;"><span style="color:var(--mu);">Compras necessárias</span><span style="color:var(--ye);">${brl(lista.reduce((a,it)=>a+Math.max(0,(it.min||0)*3-it.q)*(it.cu||0),0))}</span></div>
<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px;"><span style="color:var(--mu);">Contas a pagar</span><span style="color:var(--re);">${brl(fornNotasSemana.reduce((a,c)=>a+Number(c.val),0))}</span></div>
<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:7px;padding-top:7px;border-top:1px solid var(--br);"><span>Total previsto</span><span style="color:var(--ye);">${brl(lista.reduce((a,it)=>a+Math.max(0,(it.min||0)*3-it.q)*(it.cu||0),0)+fornNotasSemana.reduce((a,c)=>a+Number(c.val),0))}</span></div>

async function analisarMes(){
  const el=document.getElementById("ia-mensal-res");
  if(el)el.innerHTML=`<div class="ial ay"><span>⟳</span><span class="pu">Analisando o mês...</span></div>`;
  try{
    const mes=calcDREMes();
    const rec=mes.r||[];const cus=mes.c||[];
    const r=rec.reduce((a,x)=>a+Number(x.v),0);
    const c=cus.reduce((a,x)=>a+Number(x.v),0);
    const res=r-c;const m=r>0?((r-c)/r)*100:0;
    const cc={};cus.forEach(x=>{cc[x.cat]=(cc[x.cat]||0)+Number(x.v);});
    const dias=mes.resumoDias||[];
    const melhor=dias.reduce((a,d)=>d.res>a.res?d:a,{res:-Infinity,dia:""});
    const pior=dias.reduce((a,d)=>d.res<a.res?d:a,{res:Infinity,dia:""});
    const mesNome=new Date().toLocaleString('pt-BR',{month:'long',year:'numeric'});
    const d=await claudeAPI({model:MODEL,max_tokens:700,messages:[{role:"user",content:`Consultor de restaurantes BR. Analise o mês:
${mesNome} | Receita: ${brl(r)} | Custo: ${brl(c)} | Resultado: ${brl(res)} | Margem: ${m.toFixed(1)}%
Dias: ${dias.length} | Melhor: ${melhor.dia} (${brl(melhor.res)}) | Pior: ${pior.dia} (${brl(pior.res)})
Média/dia: receita ${brl(r/Math.max(dias.length,1))} | resultado ${brl(res/Math.max(dias.length,1))}
Custos: ${Object.entries(cc).map(([k,v])=>`${k}:${brl(v)}(${r>0?((v/r)*100).toFixed(0):0}%)`).join(" | ")}
Segmentos: ${SEGS.map(sg=>{const sr=rec.filter(x=>x.s===sg.id).reduce((a,x)=>a+Number(x.v),0);return sr>0?`${sg.n}:${brl(sr)}`:""}).filter(Boolean).join(" | ")||"sem dados"}
Dê: avaliação do mês + 3 pontos de melhoria + 2 metas próximo mês. Máx 200 palavras.`}]});
    const txt=(d.content||[]).map(b=>b.text||"").join("");
    if(el)el.innerHTML=`<div style="margin-bottom:8px;padding:10px;background:var(--sf2);border-radius:8px;font-size:12px;line-height:1.8;color:rgba(240,240,255,0.85);">${txt.replace(/\n/g,"<br/>")}</div>`;
  }catch(e){
    if(el)el.innerHTML=`<div class="ial ar"><span>❌</span><span>${e.message}</span></div>`;
  }
}

function gal(r,c,res,m,cus){
  if(r===0&&c===0)return`<div class="ial ay"><span>⚠️</span><span>Lance dados para análise.</span></div>`;
  let a="";
  if(res<0)a+=`<div class="ial ar"><span>🚨</span><span>Prejuízo: ${brl(Math.abs(res))}</span></div>`;
  if(m>=0&&m<10)a+=`<div class="ial ay"><span>⚠️</span><span>Margem baixa: ${m.toFixed(1)}%</span></div>`;
  const cmv=cus.filter(x=>x.cat==="Insumos/Matéria-prima").reduce((a,x)=>a+Number(x.v),0);
  if(r>0&&cmv/r>0.35)a+=`<div class="ial ar"><span>🔴</span><span>CMV alto: ${(cmv/r*100).toFixed(1)}%</span></div>`;
  if(m>=15)a+=`<div class="ial ag"><span>✅</span><span>Margem ok: ${m.toFixed(1)}%</span></div>`;
  return a||`<div class="ial ag"><span>✅</span><span>Normal.</span></div>`;
}

async function aprenderCardapio(inp){
  const f=inp?.files?.[0]; if(!f)return; inp.value="";
  const el=document.getElementById("cardapio-res");
  if(el)el.innerHTML=`<div class="ial ay"><span>⟳</span><span class="pu">Lendo cardápio...</span></div>`;
  try{
    const b64=await comprimirImagem(f,1600,1600,0.85);
    const d=await claudeAPI({model:MODEL,max_tokens:400,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:"Liste os pratos visíveis neste cardápio de restaurante, separados por vírgula."}
      ]}]});
    const itens=(d.content||[]).map(b=>b.text||"").join("").trim();
    const db=ldb();
    if(!db._cardapioHistorico)db._cardapioHistorico=[];
    db._cardapioHistorico.push({data:hj(),itens});
    // Mantém apenas últimas 30 entradas
    if(db._cardapioHistorico.length>30)db._cardapioHistorico=db._cardapioHistorico.slice(-30);
    sdb(db);
    if(el)el.innerHTML=`<div class="ial ag"><span>✅</span><span>Cardápio de ${hj()} aprendido:<br/>${itens}</span></div>`;
  }catch(e){
    if(el)el.innerHTML=`<div class="ial ar"><span>❌</span><span>${e.message}</span></div>`;
  }
}

function confEditNome(i, v) { confState.itens[i].nome = v; }
function confEditQtd(i, v) { confState.itens[i].qtdNova = parseFloat(v)||0; }
function confEditUnid(i, v) { confState.itens[i].unid = v; }

function confAddItem() {

  // foca no último input

async function iniciarConferencia(inp, origem) {
  const f = inp?.files?.[0];
  if (!f) return;
  inp.value = '';
  confState = { itens: [], fase: 'loading' };
  ir('conf');

  const msgs = ['Analisando imagem...', 'Identificando produtos...', 'Contando quantidades...', 'Comparando com estoque...'];
  let mi = 0;
  const iv = setInterval(() => {
    mi = (mi + 1) % msgs.length;
    const el = document.getElementById('conf-msg');
    if (el) el.textContent = msgs[mi];
  }, 1000);

  try {
    const b64 = await comprimirImagem(f);
    const est = gest();

    const produtosExistentes = est.length > 0
      ? `\n\nPRODUTOS JÁ NO SISTEMA (tente casar com esses nomes):\n${est.map(e => `- ${e.n} (${e.u})`).join('\n')}`
      : '';

    const data = await claudeAPI({
      model: MODEL,
      max_tokens: 1200,
      system: `Você é um especialista em conferência de estoque para restaurantes brasileiros.
Analise a imagem e identifique TODOS os produtos visíveis com suas quantidades.

REGRAS:
1. Conte embalagens, pacotes, caixas, itens visíveis
2. Para produtos a granel (carnes, queijos), estime o peso em kg
3. Para líquidos, use L ou ml
4. Para unidades contáveis, use "un"
5. Seja preciso nos nomes — use nomes comerciais comuns no Brasil
6. Se não conseguir ler o produto, descreva o que vê

Responda SOMENTE com JSON válido:
{"itens":[{"nome":"","quantidade":0,"unidade":"un","confianca":"alta|media|baixa","obs":""}],"ambiente":"geladeira|freezer|prateleira|outro","obs_geral":""}`,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
          { type: 'text', text: `Faça a conferência completa deste estoque de restaurante.${produtosExistentes}` }
        ]
      }]
    });

    clearInterval(iv);
    const txt = (data.content || []).map(b => b.text || '').join('').trim();
    const jsonM = txt.match(/\{[\s\S]*\}/);
    if (!jsonM) throw new Error('Resposta inválida da IA');
    const res = JSON.parse(jsonM[0]);

    // Casar itens com estoque existente
    const itensProcessados = (res.itens || []).map(it => {
      const prodMatch = est.find(e =>
        e.n.toLowerCase() === it.nome.toLowerCase() ||
        e.n.toLowerCase().includes(it.nome.toLowerCase()) ||
        it.nome.toLowerCase().includes(e.n.toLowerCase())
      );
      return {
        nome: it.nome,
        qtdNova: it.quantidade || 0,
        unid: it.unidade || 'un',
        confianca: it.confianca || 'media',
        obs: it.obs || '',
        prodId: prodMatch?.id || null,
        _excluir: false
      };
    });

    confState = { itens: itensProcessados, fase: 'revisar', ambiente: res.ambiente };

  } catch (e) {
    clearInterval(iv);
    confState = { itens: [], fase: 'idle' };
    ir('conf');
    setTimeout(() => {
      const main = document.getElementById('main');
      if (main) main.innerHTML = `<div class="si"><div class="ial ar"><span>❌</span><span>${e.message}</span></div><button onclick="confState={itens:[],fase:'idle'};ir('conf');" class="bok" style="margin-top:8px;">🔄 Tentar Novamente</button></div>`;
    }, 50);
    return;
  }
  ir('conf');
}

function confAplicar() {
  const db = ldb();
  if (!db.est) db.est = [];
  const itensAtivos = confState.itens.filter(it => !it._excluir && it.qtdNova >= 0);
  let atualizados = 0, novos = 0, ignorados = 0;
  const diferencas = [];

  itensAtivos.forEach(it => {
    if (!it.nome.trim()) { ignorados++; return; }
    const ex = it.prodId
      ? db.est.find(e => e.id === it.prodId)
      : db.est.find(e => e.n.toLowerCase() === it.nome.toLowerCase());

    if (ex) {
      const antes = ex.q;
      const diff = it.qtdNova - antes;
      if (Math.abs(diff) > 0.001) {
        diferencas.push({ nome: ex.n, antes, depois: it.qtdNova, diff });
      }
      ex.q = it.qtdNova;
      if (!ex.qi || ex.qi < it.qtdNova) ex.qi = it.qtdNova;
      atualizados++;
    } else {
      db.est.push({ id: uid(), n: it.nome.trim(), u: it.unid, q: it.qtdNova, qi: it.qtdNova, cu: 0, min: 0, s: [], perdas: [] });
      novos++;
    }
  });

  confState.itens.filter(it => it._excluir).forEach(() => ignorados++);
  sdb(db);

  confState = { itens: [], fase: 'aplicado', resultado: { atualizados, novos, ignorados, diferencas } };
  ir('conf');
}

  });
  sdb(db); fmov(); ir('est');
}

// SCANNER AO VIVO
// ══════════════════════════════════════
let scanStream=null, scanFlash=false;

async function abrirScanner(){
  const box=document.getElementById("scanner-box");
  const video=document.getElementById("scan-video");
  if(!box||!video)return;
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}
    });
    video.srcObject=scanStream;
    box.style.display="block";
    box.scrollIntoView({behavior:"smooth"});
    iniciarDeteccaoBordas();
  }catch(e){
    alert("Câmera não disponível: "+e.message+"\n\nUse 'Importar da Galeria'.");
  }
}

function fecharScanner(){
  if(scanStream)scanStream.getTracks().forEach(t=>t.stop());
  scanStream=null;
  const box=document.getElementById("scanner-box");
  if(box)box.style.display="none";
}

function alternarFlash(){
  if(!scanStream)return;
  const track=scanStream.getVideoTracks()[0];
  scanFlash=!scanFlash;
  track.applyConstraints({advanced:[{torch:scanFlash}]}).catch(()=>{
    alert("Flash não disponível neste dispositivo");
    scanFlash=false;
  });
}

function iniciarDeteccaoBordas(){
  const video=document.getElementById("scan-video");
  const dica=document.getElementById("scan-dica");
  if(!video||!dica)return;
  const check=()=>{
    if(!scanStream||!document.getElementById("scanner-box"))return;
    // Detecta luminosidade
    const vw=video.videoWidth||640;
    const vh=video.videoHeight||480;
    const c=document.createElement("canvas");
    c.width=64;c.height=64;
    const ctx=c.getContext("2d");
    ctx.drawImage(video,0,0,64,64);
    const d=ctx.getImageData(0,0,64,64).data;
    let lum=0;
    for(let i=0;i<d.length;i+=4)lum+=(d[i]+d[i+1]+d[i+2])/3;
    lum/=(d.length/4);
    if(lum<50){dica.textContent="⚠️ Muito escuro — acenda a luz";dica.style.background="rgba(255,136,0,0.8)";}
    else if(lum>210){dica.textContent="⚠️ Reflexo — mude o ângulo";dica.style.background="rgba(255,136,0,0.8)";}
    else{dica.textContent="✅ Capture quando estiver nítido";dica.style.background="rgba(0,0,0,0.6)";}
    setTimeout(check,1000);
  };
  video.onloadedmetadata=()=>setTimeout(check,500);
}

function capturarScanner(){
  const video=document.getElementById("scan-video");
  if(!video||!scanStream)return;
  // Captura frame do video
  const c=document.createElement("canvas");
  c.width=video.videoWidth||1280;
  c.height=video.videoHeight||720;
  const ctx=c.getContext("2d");
  // Melhora contraste para documentos
  ctx.filter="contrast(1.2) brightness(1.05) saturate(0.8)";
  ctx.drawImage(video,0,0,c.width,c.height);
  fecharScanner();
  // Converte para blob e processa como se fosse foto
  c.toBlob(blob=>{
    const file=new File([blob],"scan.jpg",{type:"image/jpeg"});
    processarArquivoNF(file);
  },"image/jpeg",0.92);
}

// Função central de processamento
async function processarArquivoNF(file){
  fs="loading"; fd=null; render();
  const scanId=Date.now();

  const setMsg=(m,s="")=>{
    const el=document.getElementById("nfm");
    const sub=document.getElementById("nfsub");
    if(el)el.textContent=m;
    if(sub)sub.textContent=s;
  };

  try{
    setMsg("Preparando imagem...","Otimizando para leitura");

    // Envia em máxima resolução para a IA ler melhor
    const b64=await comprimirImagem(file,2400,2400,0.95);
    if(!b64)throw new Error("Não foi possível processar a imagem");

    setMsg("Lendo documento...","IA analisando");

    const data=await claudeAPI({
      model:MODEL,
      max_tokens:2000,
      system:PROMPT_OCR_SYSTEM,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:`${PROMPT_OCR_USER}\n\nID: ${scanId}`}
      ]}]
    });

    const txt=(data.content||[]).map(b=>b.text||"").join("").trim();
    const jsonMatch=txt.match(/\{[\s\S]*\}/);
    if(!jsonMatch)throw new Error("Resposta inválida. Tente novamente.");
    const parsed=JSON.parse(jsonMatch[0]);
    if(parsed.valor_total<0)parsed.valor_total=0;
    parsed.itens=(parsed.itens||[]).filter(it=>it.descricao&&it.descricao.trim());
    fd=parsed; fs="done";
    fd._autoLancado=false;

  }catch(e){
    fd=e.message||"Erro desconhecido";
    fs="erro";
  }
  render();
}

// Tenta lançar automaticamente quando confiança é alta
function tentarAutoLancamento(d){
  if(!d||!d.valor_total||d.valor_total<=0)return;
  const db=ldb();
  if(!db[hj()])db[hj()]={r:[],c:[]};
  if(!db.est)db.est=[];
  if(!db.contasPagar)db.contasPagar=[];
  // 1. Lança custo no DRE
  const desc=d.fornecedor?`${d.tipo_documento==="nf"?"NF":"Doc"} ${d.fornecedor}`:"Documento escaneado";
  db[hj()].c.push({id:uid(),d:desc,cat:"Insumos/Matéria-prima",s:"",v:d.valor_total});
  // 2. Lança conta a pagar se tem fornecedor
  if(d.fornecedor){
    db.contasPagar.push({
      id:uid(),forn:d.fornecedor,val:d.valor_total,
      venc:d.data_vencimento?converterDataParaInput(d.data_vencimento):"",
      pag:"boleto",pago:false,nf:d.numero||"",semana:semana(),dt:hj()
    });
  }
  // 3. Entrada no estoque para cada item identificado
  if(d.itens?.length){
    d.itens.forEach(it=>{
      if(!it.descricao||!it.quantidade)return;
      const cu=it.valor_unitario||0;
      const ex=db.est.find(e=>e.n.toLowerCase()===it.descricao.toLowerCase());
      if(ex){ex.q+=it.quantidade;ex.qi+=it.quantidade;if(cu)ex.cu=cu;}
      else db.est.push({id:uid(),n:it.descricao,u:it.unidade||"un",q:it.quantidade,qi:it.quantidade,cu,min:0,s:[],perdas:[]});
    });
  }
  sdb(db);
  fd._autoLancado=true;
}

async function receberCompartilhamento(b64,mime,nome){
  ir('fila');await new Promise(r=>setTimeout(r,200));
  const isNF=/(nf|nota|danfe|fiscal)/i.test(nome);
  if(isNF){
