<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0a0f"/>
<title>DRE Diário — Controle Financeiro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: rgba(255,255,255,0.07);
  --text: #f0f0ff;
  --muted: rgba(240,240,255,0.4);
  --green: #00ff88;
  --red: #ff3366;
  --yellow: #ffcc00;
  --blue: #4488ff;
  --purple: #aa44ff;
  --orange: #ff8800;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}
input,select,button,textarea{font-family:'Syne',sans-serif;}

/* ── HEADER ── */
.header{padding:20px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.logo{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.data-badge{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:'Space Mono',monospace;font-size:12px;color:var(--text);}
.tabs-nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;}
.tab-btn{flex-shrink:0;padding:7px 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:1px;transition:all 0.2s;}
.tab-btn.ativo{background:var(--surface2);border-color:var(--border);color:var(--text);}

/* ── BODY ── */
.main{padding:16px 16px 100px;}

/* ── DRE HERO ── */
.dre-hero{border-radius:20px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden;}
.dre-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,255,136,0.08),rgba(68,136,255,0.05));pointer-events:none;}
.dre-hero-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.dre-hero-valor{font-family:'Space Mono',monospace;font-size:42px;font-weight:700;line-height:1;margin-bottom:6px;}
.dre-hero-valor.lucro{color:var(--green);}
.dre-hero-valor.prejuizo{color:var(--red);}
.dre-hero-sub{font-size:13px;color:var(--muted);}
.dre-hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:12px;}
.badge-lucro{background:rgba(0,255,136,0.12);border:1px solid rgba(0,255,136,0.3);color:var(--green);}
.badge-prejuizo{background:rgba(255,51,102,0.12);border:1px solid rgba(255,51,102,0.3);color:var(--red);}
.badge-atencao{background:rgba(255,204,0,0.12);border:1px solid rgba(255,204,0,0.3);color:var(--yellow);}

/* ── GRID KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;}
.kpi-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.kpi-val{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* ── SEÇÃO ── */
.secao{margin-bottom:20px;}
.secao-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.secao-titulo{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.btn-add{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;}
.btn-add:active{opacity:0.7;}

/* ── LINHA ITEM ── */
.item-linha{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.item-nome{flex:1;font-size:13px;}
.item-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.item-pct{font-size:11px;color:var(--muted);margin-left:6px;}
.btn-del{background:rgba(255,51,102,0.1);border:1px solid rgba(255,51,102,0.2);color:var(--red);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── SEGMENTOS ── */
.seg-card{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid;}
.seg-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.seg-nome{font-size:15px;font-weight:700;}
.seg-margem{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;}
.seg-barra{height:4px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:10px;}
.seg-barra-fill{height:100%;border-radius:4px;transition:width 0.6s ease;}
.seg-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-top:1px solid rgba(255,255,255,0.05);}
.seg-row:first-child{border-top:none;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.aberto{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:500px;transform:translateY(100%);transition:transform 0.3s ease;}
.modal-overlay.aberto .modal{transform:translateY(0);}
.modal-titulo{font-size:16px;font-weight:800;margin-bottom:20px;}
.campo{margin-bottom:14px;}
.campo label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.campo input,.campo select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;font-family:'Syne',sans-serif;}
.campo input:focus,.campo select:focus{border-color:rgba(255,255,255,0.2);}
.campo select option{background:var(--surface);}
.btn-salvar{width:100%;padding:15px;border-radius:14px;border:none;background:var(--green);color:#000;font-size:15px;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;margin-top:6px;}
.btn-cancelar{width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;margin-top:8px;}

/* ── IA ANÁLISE ── */
.ia-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;}
.ia-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.ia-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ia-titulo{font-size:13px;font-weight:700;}
.ia-sub{font-size:11px;color:var(--muted);}
.ia-texto{font-size:13px;color:rgba(240,240,255,0.75);line-height:1.7;}
.ia-alerta{border-radius:10px;padding:10px 12px;font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;}
.alerta-red{background:rgba(255,51,102,0.1);border:1px solid rgba(255,51,102,0.25);color:#ff6688;}
.alerta-yellow{background:rgba(255,204,0,0.1);border:1px solid rgba(255,204,0,0.25);color:#ffcc44;}
.alerta-green{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.25);color:#44ffaa;}
.btn-ia{width:100%;padding:13px;border-radius:12px;border:1px solid var(--purple);background:rgba(170,68,255,0.1);color:var(--purple);font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-ia:active{opacity:0.7;}
.btn-ia:disabled{opacity:0.4;cursor:default;}

/* ── PRECIFICAÇÃO ── */
.prec-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}
.prec-resultado{background:var(--surface2);border-radius:12px;padding:14px;margin-top:12px;}
.prec-linha{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.prec-linha:last-child{border-bottom:none;font-weight:700;font-size:15px;padding-top:10px;}
.prec-recomendado{color:var(--green);}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,0.97);border-top:1px solid var(--border);backdrop-filter:blur(20px);z-index:40;}
.nav-items{display:flex;justify-content:space-around;padding:8px 0 14px;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;border:none;background:none;cursor:pointer;color:var(--muted);transition:color 0.2s;}
.nav-item.ativo{color:var(--text);}
.nav-icon{font-size:20px;}
.nav-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:700;}

/* ── UTILS ── */
.divider{height:1px;background:var(--border);margin:16px 0;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.spin{animation:spin 0.8s linear infinite;}
.pulse{animation:pulse 1.5s ease-in-out infinite;}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slidein{animation:slidein 0.3s ease;}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="logo">DRE Diário</span>
    <span class="data-badge" id="data-atual"></span>
  </div>
  <div class="tabs-nav">
    <button class="tab-btn ativo" onclick="mudarAba('dre')">📊 DRE</button>
    <button class="tab-btn" onclick="mudarAba('segmentos')">🏪 Segmentos</button>
    <button class="tab-btn" onclick="mudarAba('precificacao')">💰 Preços</button>
    <button class="tab-btn" onclick="mudarAba('ia')">🤖 IA</button>
  </div>
</div>

<div class="main" id="main-content"></div>

<!-- MODAL ADICIONAR -->
<div class="modal-overlay" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal">
    <p class="modal-titulo" id="modal-titulo">Adicionar</p>
    <div id="modal-corpo"></div>
    <button class="btn-salvar" onclick="salvarModal()">✓ Salvar</button>
    <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-items">
    <button class="nav-item ativo" id="nav-dre" onclick="mudarAba('dre')"><span class="nav-icon">📊</span><span class="nav-label">DRE</span></button>
    <button class="nav-item" id="nav-segmentos" onclick="mudarAba('segmentos')"><span class="nav-icon">🏪</span><span class="nav-label">Segmentos</span></button>
    <button class="nav-item" id="nav-precificacao" onclick="mudarAba('precificacao')"><span class="nav-icon">💰</span><span class="nav-label">Preços</span></button>
    <button class="nav-item" id="nav-ia" onclick="mudarAba('ia')"><span class="nav-icon">🤖</span><span class="nav-label">IA</span></button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════
const PROXY = "/api/claude";
const MODEL = "claude-sonnet-4-20250514";

const SEGS = [
  {id:"restaurante", nome:"Restaurante", icon:"🍽️", cor:"#f59e0b"},
  {id:"hamburgueria", nome:"Hamburgueria", icon:"🍔", cor:"#ef4444"},
  {id:"espetaria", nome:"Espetaria", icon:"🍢", cor:"#f97316"},
  {id:"pizzaria", nome:"Pizzaria", icon:"🍕", cor:"#ec4899"},
  {id:"bar", nome:"Bar", icon:"🍺", cor:"#06b6d4"},
];

const CATS_CUSTO = [
  "Insumos/Matéria-prima",
  "Funcionários/RH",
  "Aluguel",
  "Energia/Água/Gás",
  "Embalagens",
  "Delivery (taxas)",
  "Manutenção",
  "Marketing",
  "Outros fixos",
  "Outros variáveis",
];

// ── ESTADO ──────────────────────────────────────────────
let abaAtual = "dre";
let modalTipo = "";
let dados = JSON.parse(localStorage.getItem("dre_dados") || "{}");

function initDados() {
  const hoje = today();
  if (!dados[hoje]) dados[hoje] = { receitas: [], custos: [] };
  return dados[hoje];
}

function salvarDados() {
  localStorage.setItem("dre_dados", JSON.stringify(dados));
}

const today = () => new Date().toLocaleDateString("pt-BR");
const brl = v => "R$ " + Number(v||0).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,9);

// ── CÁLCULOS ────────────────────────────────────────────
function calcDRE() {
  const d = initDados();
  const totalReceita = d.receitas.reduce((a,r) => a + Number(r.valor), 0);
  const totalCusto = d.custos.reduce((a,c) => a + Number(c.valor), 0);
  const resultado = totalReceita - totalCusto;
  const margem = totalReceita > 0 ? (resultado / totalReceita) * 100 : 0;
  return { totalReceita, totalCusto, resultado, margem, receitas: d.receitas, custos: d.custos };
}

function calcSegmento(segId) {
  const d = initDados();
  const rec = d.receitas.filter(r => r.segmento === segId).reduce((a,r) => a + Number(r.valor), 0);
  const cus = d.custos.filter(c => c.segmento === segId).reduce((a,c) => a + Number(c.valor), 0);
  const resultado = rec - cus;
  const margem = rec > 0 ? (resultado / rec) * 100 : 0;
  return { rec, cus, resultado, margem };
}

// ════════════════════════════════════════════════════════
// RENDERIZAÇÃO
// ════════════════════════════════════════════════════════
function mudarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("ativo"));
  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("ativo"));
  const tabIdx = ["dre","segmentos","precificacao","ia"].indexOf(aba);
  document.querySelectorAll(".tab-btn")[tabIdx]?.classList.add("ativo");
  document.getElementById("nav-" + aba)?.classList.add("ativo");
  render();
}

function render() {
  const el = document.getElementById("main-content");
  if (abaAtual === "dre") el.innerHTML = renderDRE();
  else if (abaAtual === "segmentos") el.innerHTML = renderSegmentos();
  else if (abaAtual === "precificacao") el.innerHTML = renderPrecificacao();
  else if (abaAtual === "ia") el.innerHTML = renderIA();
}

// ── DRE ─────────────────────────────────────────────────
function renderDRE() {
  const { totalReceita, totalCusto, resultado, margem, receitas, custos } = calcDRE();
  const isLucro = resultado >= 0;
  const cor = resultado > 0 ? "#00ff88" : resultado < 0 ? "#ff3366" : "#ffcc00";
  const status = resultado > 0 ? "✅ Lucro" : resultado < 0 ? "🚨 Prejuízo" : "⚠️ Neutro";
  const badgeClass = resultado > 0 ? "badge-lucro" : resultado < 0 ? "badge-prejuizo" : "badge-atencao";

  // KPIs por categoria de custo
  const custosPorCat = {};
  custos.forEach(c => { custosPorCat[c.categoria] = (custosPorCat[c.categoria]||0) + Number(c.valor); });

  return `
  <div class="slidein">
  <!-- HERO -->
  <div class="dre-hero" style="background:var(--surface);border:1px solid var(--border);">
    <p class="dre-hero-label">Resultado do dia · ${today()}</p>
    <p class="dre-hero-valor ${isLucro?'lucro':'prejuizo'}">${brl(resultado)}</p>
    <p class="dre-hero-sub">Margem: <strong style="color:${cor};">${margem.toFixed(1)}%</strong></p>
    <div class="dre-hero-badge ${badgeClass}">${status}</div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <p class="kpi-label">Receita Total</p>
      <p class="kpi-val" style="color:#00ff88;">${brl(totalReceita)}</p>
      <p class="kpi-sub">${receitas.length} lançamentos</p>
    </div>
    <div class="kpi-card">
      <p class="kpi-label">Custo Total</p>
      <p class="kpi-val" style="color:#ff3366;">${brl(totalCusto)}</p>
      <p class="kpi-sub">${custos.length} lançamentos</p>
    </div>
    <div class="kpi-card">
      <p class="kpi-label">CMV</p>
      <p class="kpi-val" style="color:${totalReceita>0&&(custosPorCat['Insumos/Matéria-prima']||0)/totalReceita>0.35?'#ff3366':'#ffcc00'};">${totalReceita>0?((custosPorCat['Insumos/Matéria-prima']||0)/totalReceita*100).toFixed(1):0}%</p>
      <p class="kpi-sub">Meta: até 35%</p>
    </div>
    <div class="kpi-card">
      <p class="kpi-label">Custo RH</p>
      <p class="kpi-val" style="color:${totalReceita>0&&(custosPorCat['Funcionários/RH']||0)/totalReceita>0.30?'#ff3366':'#00ff88'};">${totalReceita>0?((custosPorCat['Funcionários/RH']||0)/totalReceita*100).toFixed(1):0}%</p>
      <p class="kpi-sub">Meta: até 30%</p>
    </div>
  </div>

  <!-- RECEITAS -->
  <div class="secao">
    <div class="secao-header">
      <span class="secao-titulo">💚 Receitas</span>
      <button class="btn-add" onclick="abrirModal('receita')">+ Adicionar</button>
    </div>
    ${receitas.length === 0 ? `<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0;">Nenhuma receita lançada</p>` : receitas.map(r => {
      const seg = SEGS.find(s => s.id === r.segmento);
      return `<div class="item-linha">
        <div class="item-dot" style="background:${seg?.cor||'#888'};"></div>
        <div style="flex:1;">
          <div class="item-nome">${r.descricao}</div>
          <div style="font-size:11px;color:var(--muted);">${seg?.icon||''} ${seg?.nome||r.segmento}</div>
        </div>
        <span class="item-val" style="color:#00ff88;">${brl(r.valor)}</span>
        <button class="btn-del" onclick="deletar('receita','${r.id}')">×</button>
      </div>`;
    }).join("")}
    ${receitas.length > 0 ? `<div class="item-linha" style="background:rgba(0,255,136,0.05);border-color:rgba(0,255,136,0.15);">
      <div class="item-dot" style="background:#00ff88;"></div>
      <span class="item-nome" style="font-weight:700;">Total Receitas</span>
      <span class="item-val" style="color:#00ff88;font-size:16px;">${brl(totalReceita)}</span>
    </div>` : ""}
  </div>

  <!-- CUSTOS -->
  <div class="secao">
    <div class="secao-header">
      <span class="secao-titulo">🔴 Custos</span>
      <button class="btn-add" onclick="abrirModal('custo')">+ Adicionar</button>
    </div>
    ${custos.length === 0 ? `<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0;">Nenhum custo lançado</p>` : custos.map(c => {
      return `<div class="item-linha">
        <div class="item-dot" style="background:#ff3366;"></div>
        <div style="flex:1;">
          <div class="item-nome">${c.descricao}</div>
          <div style="font-size:11px;color:var(--muted);">${c.categoria}</div>
        </div>
        <span class="item-val" style="color:#ff3366;">${brl(c.valor)}</span>
        <button class="btn-del" onclick="deletar('custo','${c.id}')">×</button>
      </div>`;
    }).join("")}
    ${custos.length > 0 ? `<div class="item-linha" style="background:rgba(255,51,102,0.05);border-color:rgba(255,51,102,0.15);">
      <div class="item-dot" style="background:#ff3366;"></div>
      <span class="item-nome" style="font-weight:700;">Total Custos</span>
      <span class="item-val" style="color:#ff3366;font-size:16px;">${brl(totalCusto)}</span>
    </div>` : ""}
  </div>

  <!-- RESULTADO FINAL -->
  ${totalReceita > 0 || totalCusto > 0 ? `
  <div style="background:var(--surface);border:2px solid ${cor}30;border-radius:16px;padding:16px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
      <span style="font-weight:700;">Resultado Final</span>
      <span style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:${cor};">${brl(resultado)}</span>
    </div>
    <div style="height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;">
      <div style="height:100%;width:${Math.min(Math.abs(margem),100)}%;background:${cor};border-radius:4px;transition:width 0.6s;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;">
      <span>Margem: ${margem.toFixed(1)}%</span>
      <span>${isLucro ? "✅ Lucro" : "🚨 Prejuízo"}</span>
    </div>
  </div>` : ""}
  </div>`;
}

// ── SEGMENTOS ────────────────────────────────────────────
function renderSegmentos() {
  return `<div class="slidein">
  <p style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700;">Resultado por Segmento</p>
  ${SEGS.map(seg => {
    const { rec, cus, resultado, margem } = calcSegmento(seg.id);
    const cor = resultado > 0 ? "#00ff88" : resultado < 0 ? "#ff3366" : "#888";
    const pct = Math.min(Math.abs(margem), 100);
    return `<div class="seg-card" style="background:${seg.cor}08;border-color:${seg.cor}25;">
      <div class="seg-header">
        <div>
          <p class="seg-nome">${seg.icon} ${seg.nome}</p>
          <p style="font-size:11px;color:var(--muted);">Margem: <span style="color:${cor};">${margem.toFixed(1)}%</span></p>
        </div>
        <p class="seg-margem" style="color:${cor};">${brl(resultado)}</p>
      </div>
      <div class="seg-barra"><div class="seg-barra-fill" style="width:${pct}%;background:${cor};"></div></div>
      <div class="seg-row"><span style="color:var(--muted);">Receita</span><span style="color:#00ff88;font-family:'Space Mono',monospace;">${brl(rec)}</span></div>
      <div class="seg-row"><span style="color:var(--muted);">Custos</span><span style="color:#ff3366;font-family:'Space Mono',monospace;">${brl(cus)}</span></div>
      <div class="seg-row" style="font-weight:700;"><span>Resultado</span><span style="color:${cor};font-family:'Space Mono',monospace;">${brl(resultado)}</span></div>
    </div>`;
  }).join("")}
  </div>`;
}

// ── PRECIFICAÇÃO ─────────────────────────────────────────
function renderPrecificacao() {
  return `<div class="slidein">
  <p style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700;">Calculadora de Preços</p>
  
  <div class="prec-card">
    <p style="font-weight:700;margin-bottom:14px;">🧮 Calcular Preço de Venda</p>
    <div class="campo">
      <label>Custo do Produto (R$)</label>
      <input type="number" id="prec-custo" placeholder="0,00" step="0.01" oninput="calcPreco()"/>
    </div>
    <div class="campo">
      <label>Margem Desejada (%)</label>
      <input type="number" id="prec-margem" placeholder="30" value="30" oninput="calcPreco()"/>
    </div>
    <div class="campo">
      <label>Taxa Delivery (%)</label>
      <input type="number" id="prec-delivery" placeholder="0" value="0" oninput="calcPreco()"/>
    </div>
    <div id="prec-resultado" class="prec-resultado" style="display:none;"></div>
  </div>

  <div class="prec-card">
    <p style="font-weight:700;margin-bottom:14px;">📊 Benchmarks do Setor</p>
    <div class="item-linha"><div class="item-dot" style="background:#00ff88;"></div><span class="item-nome">CMV ideal (insumos)</span><span class="item-val" style="color:#00ff88;">25–35%</span></div>
    <div class="item-linha"><div class="item-dot" style="background:#4488ff;"></div><span class="item-nome">Custo RH</span><span class="item-val" style="color:#4488ff;">25–35%</span></div>
    <div class="item-linha"><div class="item-dot" style="background:#ffcc00;"></div><span class="item-nome">Custos fixos</span><span class="item-val" style="color:#ffcc00;">10–15%</span></div>
    <div class="item-linha"><div class="item-dot" style="background:#00ff88;"></div><span class="item-nome">Margem líquida ideal</span><span class="item-val" style="color:#00ff88;">15–25%</span></div>
    <div class="item-linha"><div class="item-dot" style="background:#ff3366;"></div><span class="item-nome">Alerta de prejuízo</span><span class="item-val" style="color:#ff3366;">&lt; 0%</span></div>
  </div>
  </div>`;
}

function calcPreco() {
  const custo = parseFloat(document.getElementById("prec-custo")?.value) || 0;
  const margem = parseFloat(document.getElementById("prec-margem")?.value) || 30;
  const delivery = parseFloat(document.getElementById("prec-delivery")?.value) || 0;
  if (!custo) { document.getElementById("prec-resultado").style.display = "none"; return; }
  const precoBase = custo / (1 - margem/100);
  const precoComDelivery = delivery > 0 ? precoBase / (1 - delivery/100) : precoBase;
  const lucro = precoComDelivery - custo;
  const margemReal = (lucro / precoComDelivery) * 100;
  document.getElementById("prec-resultado").style.display = "block";
  document.getElementById("prec-resultado").innerHTML = `
    <div class="prec-linha"><span style="color:var(--muted);">Custo do produto</span><span>${brl(custo)}</span></div>
    <div class="prec-linha"><span style="color:var(--muted);">Markup aplicado</span><span>${(precoBase/custo).toFixed(2)}x</span></div>
    ${delivery > 0 ? `<div class="prec-linha"><span style="color:var(--muted);">Taxa delivery (${delivery}%)</span><span style="color:#ff3366;">-${brl(precoComDelivery * delivery/100)}</span></div>` : ""}
    <div class="prec-linha"><span style="color:var(--muted);">Lucro por unidade</span><span style="color:#00ff88;">${brl(lucro)}</span></div>
    <div class="prec-linha prec-recomendado"><span>💰 Preço recomendado</span><span>${brl(precoComDelivery)}</span></div>
  `;
}

// ── IA ───────────────────────────────────────────────────
function renderIA() {
  const { totalReceita, totalCusto, resultado, margem, receitas, custos } = calcDRE();
  return `<div class="slidein">
  <div class="ia-box">
    <div class="ia-header">
      <div class="ia-icon">🤖</div>
      <div><p class="ia-titulo">Análise Inteligente</p><p class="ia-sub">IA analisa seu DRE e dá recomendações</p></div>
    </div>
    <div id="ia-alertas">${gerarAlertasLocais(totalReceita, totalCusto, resultado, margem, custos)}</div>
    <div id="ia-analise-texto"></div>
    <button class="btn-ia" id="btn-ia" onclick="analisarComIA()" ${totalReceita === 0 && totalCusto === 0 ? "disabled" : ""}>
      ✨ Analisar com Claude IA
    </button>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;">Análise detalhada com sugestões de melhoria</p>
  </div>

  <div class="prec-card">
    <p style="font-weight:700;margin-bottom:12px;">📋 Resumo do Dia</p>
    <div class="prec-linha"><span style="color:var(--muted);">Receita total</span><span style="color:#00ff88;">${brl(totalReceita)}</span></div>
    <div class="prec-linha"><span style="color:var(--muted);">Custo total</span><span style="color:#ff3366;">${brl(totalCusto)}</span></div>
    <div class="prec-linha"><span style="color:var(--muted);">Margem</span><span style="color:${margem>=15?'#00ff88':margem>=0?'#ffcc00':'#ff3366'};">${margem.toFixed(1)}%</span></div>
    <div class="prec-linha" style="font-size:15px;font-weight:700;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);"><span>Resultado</span><span style="color:${resultado>=0?'#00ff88':'#ff3366'};">${brl(resultado)}</span></div>
  </div>
  </div>`;
}

function gerarAlertasLocais(totalReceita, totalCusto, resultado, margem, custos) {
  if (totalReceita === 0 && totalCusto === 0) {
    return `<div class="ia-alerta alerta-yellow"><span>⚠️</span><span>Lance receitas e custos do dia para ver a análise automática.</span></div>`;
  }
  let alertas = "";
  if (resultado < 0) alertas += `<div class="ia-alerta alerta-red"><span>🚨</span><span>Prejuízo de ${brl(Math.abs(resultado))} hoje! Custos superam receitas em ${Math.abs(margem).toFixed(1)}%.</span></div>`;
  if (margem >= 0 && margem < 10) alertas += `<div class="ia-alerta alerta-yellow"><span>⚠️</span><span>Margem muito baixa (${margem.toFixed(1)}%). Ideal é acima de 15%.</span></div>`;
  const cmv = custos.filter(c=>c.categoria==="Insumos/Matéria-prima").reduce((a,c)=>a+Number(c.valor),0);
  if (totalReceita > 0 && cmv/totalReceita > 0.35) alertas += `<div class="ia-alerta alerta-red"><span>🔴</span><span>CMV alto: ${(cmv/totalReceita*100).toFixed(1)}% das receitas. Revise preços ou fornecedores.</span></div>`;
  const rh = custos.filter(c=>c.categoria==="Funcionários/RH").reduce((a,c)=>a+Number(c.valor),0);
  if (totalReceita > 0 && rh/totalReceita > 0.35) alertas += `<div class="ia-alerta alerta-yellow"><span>⚠️</span><span>Custo RH alto: ${(rh/totalReceita*100).toFixed(1)}% da receita. Meta é até 30-35%.</span></div>`;
  if (margem >= 15) alertas += `<div class="ia-alerta alerta-green"><span>✅</span><span>Margem saudável! ${margem.toFixed(1)}% de lucro líquido.</span></div>`;
  return alertas || `<div class="ia-alerta alerta-green"><span>✅</span><span>Operação dentro dos parâmetros normais.</span></div>`;
}

async function analisarComIA() {
  const { totalReceita, totalCusto, resultado, margem, receitas, custos } = calcDRE();
  const btn = document.getElementById("btn-ia");
  const el = document.getElementById("ia-analise-texto");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin">⟳</span> Analisando...`;
  el.innerHTML = `<p style="color:var(--muted);font-size:13px;text-align:center;padding:12px;" class="pulse">Claude está analisando seu DRE...</p>`;

  const custosPorCat = {};
  custos.forEach(c => { custosPorCat[c.categoria] = (custosPorCat[c.categoria]||0) + Number(c.valor); });

  const prompt = `Você é um consultor financeiro especialista em restaurantes brasileiros. Analise este DRE diário e dê recomendações práticas e objetivas em português.

DRE do dia ${today()}:
- Receita total: R$ ${totalReceita.toFixed(2)}
- Custo total: R$ ${totalCusto.toFixed(2)}
- Resultado: R$ ${resultado.toFixed(2)}
- Margem líquida: ${margem.toFixed(1)}%

Custos por categoria:
${Object.entries(custosPorCat).map(([k,v]) => `- ${k}: R$ ${v.toFixed(2)} (${totalReceita>0?(v/totalReceita*100).toFixed(1):0}% da receita)`).join("\n")}

Receitas por segmento:
${SEGS.map(s => {
  const rec = receitas.filter(r=>r.segmento===s.id).reduce((a,r)=>a+Number(r.valor),0);
  return rec > 0 ? `- ${s.nome}: R$ ${rec.toFixed(2)}` : null;
}).filter(Boolean).join("\n") || "Nenhuma receita por segmento"}

Dê uma análise em 3-4 parágrafos curtos:
1. Diagnóstico rápido (está bem ou mal?)
2. Principal problema identificado
3. 2-3 ações concretas para melhorar
4. Meta para o próximo dia

Seja direto, use linguagem simples, foque no que mais importa para um dono de restaurante.`;

  try {
    const r = await fetch(PROXY, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await r.json();
    const texto = (data.content||[]).map(b=>b.text||"").join("");
    el.innerHTML = `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);"><p class="ia-texto">${texto.replace(/\n/g,"<br/>")}</p></div>`;
  } catch(e) {
    el.innerHTML = `<div class="ia-alerta alerta-yellow" style="margin-top:10px;"><span>⚠️</span><span>Não foi possível conectar à IA. Verifique sua conexão.</span></div>`;
  }
  btn.disabled = false;
  btn.innerHTML = `✨ Analisar com Claude IA`;
}

// ════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════
function abrirModal(tipo) {
  modalTipo = tipo;
  const overlay = document.getElementById("modal-overlay");
  const titulo = document.getElementById("modal-titulo");
  const corpo = document.getElementById("modal-corpo");
  titulo.textContent = tipo === "receita" ? "💚 Adicionar Receita" : "🔴 Adicionar Custo";
  if (tipo === "receita") {
    corpo.innerHTML = `
      <div class="campo"><label>Descrição</label><input type="text" id="m-desc" placeholder="Ex: Vendas restaurante almoço"/></div>
      <div class="campo"><label>Segmento</label><select id="m-seg">${SEGS.map(s=>`<option value="${s.id}">${s.icon} ${s.nome}</option>`).join("")}</select></div>
      <div class="campo"><label>Valor (R$)</label><input type="number" id="m-val" placeholder="0,00" step="0.01"/></div>`;
  } else {
    corpo.innerHTML = `
      <div class="campo"><label>Descrição</label><input type="text" id="m-desc" placeholder="Ex: Compra de carne"/></div>
      <div class="campo"><label>Categoria</label><select id="m-cat">${CATS_CUSTO.map(c=>`<option value="${c}">${c}</option>`).join("")}</select></div>
      <div class="campo"><label>Segmento (opcional)</label><select id="m-seg"><option value="">Geral</option>${SEGS.map(s=>`<option value="${s.id}">${s.icon} ${s.nome}</option>`).join("")}</select></div>
      <div class="campo"><label>Valor (R$)</label><input type="number" id="m-val" placeholder="0,00" step="0.01"/></div>`;
  }
  overlay.classList.add("aberto");
  setTimeout(() => document.getElementById("m-desc")?.focus(), 300);
}

function fecharModal(e) {
  if (e && e.target !== document.getElementById("modal-overlay")) return;
  document.getElementById("modal-overlay").classList.remove("aberto");
}

function salvarModal() {
  const desc = document.getElementById("m-desc")?.value?.trim();
  const val = parseFloat(document.getElementById("m-val")?.value);
  if (!desc || !val || val <= 0) { alert("Preencha descrição e valor!"); return; }
  const d = initDados();
  if (modalTipo === "receita") {
    const seg = document.getElementById("m-seg")?.value;
    d.receitas.push({ id: uid(), descricao: desc, segmento: seg, valor: val });
  } else {
    const cat = document.getElementById("m-cat")?.value;
    const seg = document.getElementById("m-seg")?.value;
    d.custos.push({ id: uid(), descricao: desc, categoria: cat, segmento: seg, valor: val });
  }
  salvarDados();
  document.getElementById("modal-overlay").classList.remove("aberto");
  render();
}

function deletar(tipo, id) {
  if (!confirm("Remover este lançamento?")) return;
  const d = initDados();
  if (tipo === "receita") d.receitas = d.receitas.filter(r => r.id !== id);
  else d.custos = d.custos.filter(c => c.id !== id);
  salvarDados();
  render();
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
document.getElementById("data-atual").textContent = today();
initDados();
render();
</script>
