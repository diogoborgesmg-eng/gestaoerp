<!DOCTYPE html>

<title>GestaoERP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');
:root{--bg:#0a0a0f;--sf:#12121a;--sf2:#1a1a26;--br:rgba(255,255,255,0.07);--tx:#f0f0ff;--mu:rgba(240,240,255,0.4);--gr:#00ff88;--re:#ff3366;--ye:#ffcc00;--bl:#4488ff;--pu:#aa44ff;--or:#ff8800;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}
input,select,button,textarea{font-family:'Syne',sans-serif;}
.hdr{padding:13px 13px 9px;border-bottom:1px solid var(--br);position:sticky;top:0;z-index:50;background:rgba(10,10,15,0.97);backdrop-filter:blur(20px);}
.ht{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.logo{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--mu);}
.db{background:var(--sf2);border:1px solid var(--br);border-radius:6px;padding:4px 8px;font-family:'Space Mono',monospace;font-size:10px;}
.tnav{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.tnav::-webkit-scrollbar{display:none;}
.tb{flex-shrink:0;padding:5px 10px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--mu);font-size:10px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
.tb.a{background:var(--sf2);border-color:var(--br);color:var(--tx);}
.main{padding:12px 12px 96px;}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px;}
.kpi{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:10px;}
.kl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:3px;}
.kv{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;}
.ks{font-size:10px;color:var(--mu);margin-top:1px;}
.hero{border-radius:15px;padding:16px;margin-bottom:11px;background:var(--sf);border:1px solid var(--br);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,255,136,0.04),rgba(68,136,255,0.03));pointer-events:none;}
.hl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--mu);margin-bottom:4px;}
.hv{font-family:'Space Mono',monospace;font-size:34px;font-weight:700;line-height:1;margin-bottom:3px;}
.hs{font-size:11px;color:var(--mu);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-top:8px;}
.bg{background:rgba(0,255,136,0.12);border:1px solid rgba(0,255,136,0.3);color:var(--gr);}
.br2{background:rgba(255,51,102,0.12);border:1px solid rgba(255,51,102,0.3);color:var(--re);}
.by{background:rgba(255,204,0,0.12);border:1px solid rgba(255,204,0,0.3);color:var(--ye);}
.sec{margin-bottom:14px;}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.st{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--mu);font-weight:700;}
.badd{background:var(--sf2);border:1px solid var(--br);color:var(--tx);padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;}
.item{display:flex;align-items:center;gap:7px;padding:9px 10px;background:var(--sf);border:1px solid var(--br);border-radius:10px;margin-bottom:4px;}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.in{flex:1;font-size:12px;}
.is{font-size:10px;color:var(--mu);}
.iv{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;}
.bdel{background:rgba(255,51,102,0.1);border:1px solid rgba(255,51,102,0.2);color:var(--re);width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:8px;}
.pl{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--br);}
.pl:last-child{border-bottom:none;font-weight:700;font-size:14px;padding-top:7px;}
.mov{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.22s;}
.mov.ab{opacity:1;pointer-events:all;}
.mo{background:var(--sf);border-radius:18px 18px 0 0;padding:18px 15px 36px;width:100%;max-width:500px;transform:translateY(100%);transition:transform 0.28s ease;max-height:90vh;overflow-y:auto;}
.mov.ab .mo{transform:translateY(0);}
.mt2{font-size:14px;font-weight:800;margin-bottom:13px;}
.campo{margin-bottom:10px;}
.campo label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:3px;}
.campo input,.campo select,.campo textarea{width:100%;background:var(--sf2);border:1px solid var(--br);border-radius:9px;padding:10px 11px;color:var(--tx);font-size:13px;outline:none;font-family:'Syne',sans-serif;}
.campo textarea{resize:vertical;min-height:60px;}
.campo select option{background:var(--sf);}
.bok{width:100%;padding:13px;border-radius:10px;border:none;background:var(--gr);color:#000;font-size:13px;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;margin-top:2px;}
.bcan{width:100%;padding:9px;border-radius:10px;border:1px solid var(--br);background:transparent;color:var(--mu);font-size:12px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;margin-top:5px;}
.vbtn{width:100%;padding:14px;border-radius:13px;border:2px solid rgba(170,68,255,0.4);background:rgba(170,68,255,0.08);color:var(--pu);font-size:13px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;}
.vbtn.ouv{border-color:var(--re);background:rgba(255,51,102,0.12);color:var(--re);animation:pulse 0.9s ease-in-out infinite;}
.vres{background:var(--sf2);border:1px solid var(--br);border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px;line-height:1.6;}
.ial{border-radius:8px;padding:8px 10px;font-size:11px;font-weight:600;margin-bottom:6px;display:flex;align-items:flex-start;gap:6px;line-height:1.5;}
.ar{background:rgba(255,51,102,0.1);border:1px solid rgba(255,51,102,0.25);color:#ff6688;}
.ay{background:rgba(255,204,0,0.1);border:1px solid rgba(255,204,0,0.25);color:#ffcc44;}
.ag{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.25);color:#44ffaa;}
.ao{background:rgba(255,136,0,0.1);border:1px solid rgba(255,136,0,0.25);color:#ffaa44;}
.bia{width:100%;padding:11px;border-radius:10px;border:1px solid var(--pu);background:rgba(170,68,255,0.1);color:var(--pu);font-size:12px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;}
.bprog{height:4px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin:6px 0;}
.bfill{height:100%;border-radius:3px;transition:width 0.5s;}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,0.97);border-top:1px solid var(--br);backdrop-filter:blur(20px);z-index:40;}
.nis{display:flex;justify-content:space-around;padding:5px 0 10px;}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 5px;border:none;background:none;cursor:pointer;color:var(--mu);}
.ni.a{color:var(--tx);}
.nico{font-size:17px;}
.nila{font-size:8px;letter-spacing:1px;text-transform:uppercase;font-weight:700;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sp{animation:spin 0.8s linear infinite;}
.pu{animation:pulse 1.5s ease-in-out infinite;}
@keyframes si{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.si{animation:si 0.22s ease;}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;margin:2px;border:1px solid;}
.sep{height:1px;background:var(--br);margin:10px 0;}

/* Config panel */
.cfg-panel{background:var(--sf);border:1px solid rgba(170,68,255,0.3);border-radius:12px;padding:12px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="hdr">
  <div class="ht">
    <span class="logo">GestaoERP</span>

      <span class="db" id="data"></span>

  <button class="ni a" id="n-dre" onclick="ir('dre')"><span class="nico">📊</span><span class="nila">DRE</span></button>
  <button class="ni" id="n-est" onclick="ir('est')"><span class="nico">📦</span><span class="nila">Estoque</span></button>

  <button class="ni" id="n-vendas" onclick="ir('vendas')"><span class="nico">💰</span><span class="nila">Vendas</span></button>
  <button class="ni" id="n-voz" onclick="ir('voz')"><span class="nico">🎙️</span><span class="nila">Voz</span></button>
  <button class="ni" id="n-forn" onclick="ir('forn')"><span class="nico">🏭</span><span class="nila">Fornec.</span></button>
  <button class="ni" id="n-ficha" onclick="ir('ficha')"><span class="nico">📋</span><span class="nila">Fichas</span></button>
  <button class="ni" id="n-compras" onclick="ir('compras')"><span class="nico">🛒</span><span class="nila">Compras</span></button>

</div></div>

<script>
// ══════════════════════════════════════
// CONFIG — chave API salva no localStorage
// ══════════════════════════════════════
const MODEL = "claude-sonnet-4-6";
const API_URL = "https://api.anthropic.com/v1/messages";

function getApiKey(){return localStorage.getItem("erp_apikey")||"";}
function setApiKey(k){localStorage.setItem("erp_apikey",k.trim());}

// Chamada direta à API Anthropic (sem proxy)
async function claudeAPI(payload, tentativa=1){
  const key = getApiKey();
  if(!key) throw new Error("Configure sua chave API em ⚙️ Config");
  const rsp = await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify(payload)
  });
  if(!rsp.ok){
    const err = await rsp.json().catch(()=>({}));
    // Retry automático no erro 500 (uma vez)
    if(rsp.status===500&&tentativa===1){
      await new Promise(r=>setTimeout(r,2000));
      return claudeAPI(payload, 2);
    }
    throw new Error(err?.error?.message || "Erro "+rsp.status);
  }
  return rsp.json();
}

const SEGS=[{id:"restaurante",n:"Restaurante",i:"🍽️",c:"#f59e0b"},{id:"hamburgueria",n:"Hamburgueria",i:"🍔",c:"#ef4444"},{id:"espetaria",n:"Espetaria",i:"🍢",c:"#f97316"},{id:"pizzaria",n:"Pizzaria",i:"🍕",c:"#ec4899"},{id:"bar",n:"Bar",i:"🍺",c:"#06b6d4"}];
const CATS=["Insumos/Matéria-prima","Funcionários/RH","Aluguel","Energia/Água/Gás","Embalagens","Delivery (taxas)","Manutenção","Marketing","Outros fixos","Outros variáveis"];
const brl=v=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const hj=()=>new Date().toLocaleDateString("pt-BR");
const semana=()=>{const d=new Date();const s=Math.ceil(d.getDate()/7);return `${d.getMonth()+1}/${d.getFullYear()}-S${s}`;};

// ══════════════════════════════════════
// FILA DE DIGITALIZAÇÃO
// ══════════════════════════════════════
function gFila(){const d=ldb();if(!d.fila)d.fila=[];return d.fila;}
function sFila(f){const d=ldb();d.fila=f;sdb(d);}

function rFila(){
  const temChave=getApiKey().length>10;
  const fila=gFila();
  const pendentes=fila.filter(f=>f.status==="pendente");
  const processando=fila.filter(f=>f.status==="processando");
  const prontos=fila.filter(f=>f.status==="pronto");

  if(!temChave) return `<div class="si"><div class="ial ar"><span>🔑</span><span>Configure sua chave API em ⚙️ Config.</span></div></div>`;

  return`<div class="si">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
<p style="font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--mu);font-weight:700;">📥 Fila de Digitalização</p>
<div style="display:flex;gap:4px;">
${pendentes.length>0?`<span style="background:rgba(255,204,0,0.15);border:1px solid rgba(255,204,0,0.3);color:var(--ye);font-size:10px;padding:2px 7px;border-radius:5px;">${pendentes.length} pendente${pendentes.length>1?"s":""}</span>`:""}
${prontos.length>0?`<span style="background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.3);color:var(--gr);font-size:10px;padding:2px 7px;border-radius:5px;">${prontos.length} pronto${prontos.length>1?"s":""}</span>`:""}
</div>
</div>

<!-- BOTÃO ESCANEAR -->
<label style="display:block;cursor:pointer;margin-bottom:8px;">
<input type="file" accept="image/*" capture="environment" multiple style="position:absolute;width:1px;height:1px;opacity:0;" onchange="adicionarNaFila(this)"/>
<div style="border:2px dashed rgba(0,255,136,0.4);background:rgba(0,255,136,0.05);border-radius:14px;padding:16px;text-align:center;">
<div style="font-size:36px;margin-bottom:6px;">📷</div>
<p style="font-size:14px;font-weight:800;color:var(--gr);margin-bottom:2px;">Escanear NF</p>
<p style="font-size:11px;color:var(--mu);">Tire fotos seguidas — todas vão para a fila</p>
</div></label>

<label style="display:block;cursor:pointer;margin-bottom:8px;">
<input type="file" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;" onchange="adicionarNaFila(this)"/>
<div style="border:1px solid var(--br);background:var(--sf);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;">
<span style="font-size:22px;">🖼️</span>
<div><p style="font-weight:700;font-size:12px;">Importar da Galeria</p><p style="font-size:10px;color:var(--mu);">Selecione várias fotos de uma vez</p></div>
</div></label>

<!-- CHAVE NF 44 DÍGITOS -->
<div style="border:1px solid rgba(68,136,255,0.3);background:rgba(68,136,255,0.05);border-radius:10px;padding:12px;margin-bottom:8px;">
<p style="font-weight:700;font-size:12px;color:var(--bl);margin-bottom:6px;">🔑 Chave NF-e (44 dígitos)</p>
<p style="font-size:11px;color:var(--mu);margin-bottom:8px;">Consulta direta na SEFAZ — dados 100% corretos</p>
<div style="display:flex;gap:6px;margin-bottom:6px;">
<input type="text" id="chave-nf" maxlength="47" placeholder="0000 0000 0000 0000 0000..." 
style="flex:1;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:9px;color:var(--tx);font-size:11px;font-family:'Space Mono',monospace;"
oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{4})(?=\d)/g,'$1 ').trim()"/>
</div>
<div style="display:flex;gap:6px;">
<button onclick="adicionarPorChave()" style="flex:2;padding:10px;border-radius:8px;border:none;background:var(--bl);color:#fff;font-size:12px;font-weight:700;cursor:pointer;">🔍 Consultar SEFAZ</button>
<label style="flex:1;cursor:pointer;">
<input type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;" onchange="lerCodigoBarras(this)"/>
<div style="padding:10px;border-radius:8px;border:1px solid rgba(68,136,255,0.4);background:rgba(68,136,255,0.1);color:var(--bl);font-size:11px;font-weight:700;text-align:center;">📷 Barras</div>
</label>
</div>
</div>

<!-- COLAR TEXTO -->
<div style="border:1px solid rgba(170,68,255,0.3);background:rgba(170,68,255,0.05);border-radius:10px;padding:12px;margin-bottom:12px;">
<p style="font-weight:700;font-size:12px;color:var(--pu);margin-bottom:4px;">📋 Colar texto (CamScanner)</p>
<p style="font-size:11px;color:var(--mu);margin-bottom:8px;">CamScanner → Extrair Texto → cole aqui</p>
<textarea id="txt-fila" placeholder="Cole o texto extraído aqui..." 
style="width:100%;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:9px;color:var(--tx);font-size:11px;min-height:60px;font-family:'Space Mono',monospace;resize:vertical;"></textarea>
<button onclick="adicionarPorTexto()" style="width:100%;margin-top:6px;padding:10px;border-radius:8px;border:none;background:var(--pu);color:#fff;font-size:12px;font-weight:700;cursor:pointer;">+ Adicionar à Fila</button>
</div>

<!-- COMPROVANTE DE PAGAMENTO -->
<div style="border:1px solid rgba(0,255,136,0.3);background:rgba(0,255,136,0.05);border-radius:10px;padding:12px;margin-bottom:12px;">
<p style="font-weight:700;font-size:12px;color:var(--gr);margin-bottom:4px;">✅ Comprovante de Pagamento</p>
<p style="font-size:11px;color:var(--mu);margin-bottom:8px;">PIX, boleto ou transferência — dá baixa automática nas contas a pagar</p>
<label style="display:block;cursor:pointer;">
<input type="file" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0;" onchange="processarComprovante(this)"/>
<div style="border:1px dashed rgba(0,255,136,0.4);border-radius:8px;padding:10px;display:flex;align-items:center;gap:10px;">
<span style="font-size:22px;">📷</span>
<div><p style="font-weight:700;font-size:12px;">Foto do comprovante</p><p style="font-size:10px;color:var(--mu);">PIX, boleto, transferência</p></div>
</div></label>
</div>
${fila.length===0?`<div class="card"><p style="text-align:center;color:var(--mu);font-size:12px;padding:20px 0;">Nenhum documento na fila<br/><span style="font-size:11px;">Escanei as NFs para começar</span></p></div>`:""}

${fila.map((item,i)=>{
  const corStatus={pendente:"rgba(255,204,0,0.2)",processando:"rgba(68,136,255,0.2)",revisao:"rgba(170,68,255,0.2)",pronto:"rgba(0,255,136,0.2)",erro:"rgba(255,51,102,0.2)"};
  const iconeStatus={pendente:"⏳",processando:"⟳",revisao:"✏️",pronto:"✅",erro:"❌"};

// Adiciona NF por chave de 44 dígitos — consulta SEFAZ
async function adicionarPorChave(){
  const inp=document.getElementById("chave-nf");
  const chave=(inp?.value||"").replace(/\s/g,"");
  if(chave.length!==44){alert("A chave deve ter 44 dígitos!");return;}
  const fila=gFila();
  const item={id:uid(),chave,imagem:null,status:"processando",
    horario:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    fornecedor:"Consultando SEFAZ...",valor:null,numero:null,data:null,itens:[],erro:null,fonte:"chave"};
  fila.push(item);sFila(fila);
  if(inp)inp.value="";
  render();
  try{
    // Consulta via proxy Vercel
    const rsp=await fetch("/api/sefaz",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chave})
    });
    if(!rsp.ok)throw new Error("SEFAZ indisponível ("+rsp.status+")");
    const dados=await rsp.json();
    if(dados.erro)throw new Error(dados.erro);
    // Atualiza item com dados do XML
    const idx=fila.findIndex(f=>f.id===item.id);
    if(idx>=0){
      fila[idx].status="pronto";
      fila[idx].fornecedor=dados.fornecedor||"Fornecedor";
      fila[idx].cnpj=dados.cnpj||"";
      fila[idx].numero=dados.numero||"";
      fila[idx].data=dados.data||"";
      fila[idx].vencimento=dados.vencimento||"";
      fila[idx].valor=dados.valor_total||0;
      fila[idx].itens=dados.itens||[];
      fila[idx].textoOriginal="Dados via SEFAZ XML";
    }
  }catch(e){
    const idx=fila.findIndex(f=>f.id===item.id);
    if(idx>=0){fila[idx].status="erro";fila[idx].erro=e.message;fila[idx].fornecedor="Erro SEFAZ";}
  }
  sFila(fila);render();
}

// Lê código de barras da NF para extrair a chave
async function lerCodigoBarras(inp){
  const f=inp?.files?.[0];if(!f)return;inp.value="";
  const inp2=document.getElementById("chave-nf");
  if(!inp2)return;
  inp2.value="Lendo código...";
  try{
    const b64=await comprimirImagem(f,1600,1600,0.90);
    const data=await claudeAPI({
      model:MODEL,max_tokens:200,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:"Leia o código de barras ou QR code desta nota fiscal e retorne APENAS os 44 dígitos numéricos da chave de acesso, sem espaços ou caracteres extras."}
      ]}]
    });
    const chave=(data.content||[]).map(b=>b.text||"").join("").replace(/\D/g,"").slice(0,44);
    if(chave.length===44){
      inp2.value=chave.replace(/(\d{4})(?=\d)/g,"$1 ").trim();
    }else{
      inp2.value="";
      alert("Não consegui ler a chave. Digite manualmente.");
    }
  }catch(e){inp2.value="";alert("Erro: "+e.message);}
}

// Adiciona NF por texto colado (CamScanner)
async function adicionarPorTexto(){
  const texto=document.getElementById("txt-fila")?.value?.trim();
  if(!texto||texto.length<20){alert("Cole o texto da NF primeiro!");return;}
  const fila=gFila();
  const item={id:uid(),imagem:null,status:"processando",texto,
    horario:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    fornecedor:"Interpretando...",valor:null,numero:null,data:null,itens:[],erro:null,fonte:"texto"};
  fila.push(item);sFila(fila);
  const txtEl=document.getElementById("txt-fila");
  if(txtEl)txtEl.value="";
  render();
  try{
    const interpData=await claudeAPI({
      model:MODEL,max_tokens:2500,
      system:`Interprete texto de nota fiscal brasileira. REGRAS:
1. Cada produto = item separado
2. Formato NxM = unidades por caixa (12X1 → upc:12)
3. Vencimento: campo FAT/FATURA
4. Valor: VALOR A COBRAR
5. Converta BR: vírgula=decimal, ponto=milhar
JSON: {"fornecedor":"","cnpj":"","numero":"","data":"DD/MM/AAAA","vencimento":"DD/MM/AAAA","valor_total":0.00,"itens":[{"descricao":"","quantidade":0,"unidade":"cx","unidades_por_cx":1,"valor_unitario":0.00,"valor_total":0.00}]}`,
      messages:[{role:"user",content:`Extraia dados desta NF:\n\n${texto}`}]
    });
    const txt=(interpData.content||[]).map(b=>b.text||"").join("").trim();
    const jsonM=txt.match(/\{[\s\S]*\}/);
    if(!jsonM)throw new Error("Não interpretou o texto");
    const dados=JSON.parse(jsonM[0]);
    const idx=fila.findIndex(f=>f.id===item.id);
    if(idx>=0){
      fila[idx].status="pronto";
      fila[idx].fornecedor=dados.fornecedor||"Fornecedor";
      fila[idx].cnpj=dados.cnpj||"";
      fila[idx].numero=dados.numero||"";
      fila[idx].data=dados.data||"";
      fila[idx].vencimento=dados.vencimento||"";
      fila[idx].valor=dados.valor_total||0;
      fila[idx].itens=dados.itens||[];
      fila[idx].textoOriginal=texto;
    }
  }catch(e){
    const idx=fila.findIndex(f=>f.id===item.id);
    if(idx>=0){fila[idx].status="erro";fila[idx].erro=e.message;fila[idx].fornecedor="Erro";}
  }
  sFila(fila);render();
}

// Adiciona fotos na fila
async function adicionarNaFila(inp){
  const files=Array.from(inp?.files||[]);
  if(!files.length)return;
  inp.value="";
  const fila=gFila();
  for(const f of files){
    const b64=await comprimirImagem(f,2400,2400,0.95);
    if(!b64)continue;
    fila.push({
      id:uid(),
      imagem:b64,
      status:"pendente",
      horario:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
      fornecedor:null,valor:null,numero:null,data:null,itens:[],erro:null
    });
  }
  sFila(fila);
  render();
}

    // Lê o comprovante
    const data=await claudeAPI({
      model:MODEL, max_tokens:800,
      system:`Leia este comprovante de pagamento brasileiro e retorne SOMENTE JSON:
{"tipo":"pix|boleto|ted|doc|cheque","favorecido":"","cnpj_favorecido":"","valor":0.00,"data":"DD/MM/AAAA","banco_origem":"","descricao":"","autenticacao":""}`,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:"Leia este comprovante de pagamento e extraia: tipo, favorecido (quem recebeu), valor, data e autenticação."}
      ]}]
    });

    const txt=(data.content||[]).map(b=>b.text||"").join("").trim();
    const jsonM=txt.match(/\{[\s\S]*\}/);
    if(!jsonM)throw new Error("Não consegui ler o comprovante");
    const comp=JSON.parse(jsonM[0]);

    if(!comp.valor||comp.valor<=0)throw new Error("Valor não identificado no comprovante");

    // Busca conta a pagar correspondente
    const db=ldb();
    const contasPagar=db.contasPagar||[];
    const contasAbertas=contasPagar.filter(c=>!c.pago);

    // Tenta casar por fornecedor + valor
    let contasCasadas=contasAbertas.filter(c=>{
      const nomeMatch=c.forn?.toLowerCase().includes(comp.favorecido?.toLowerCase())||
                      comp.favorecido?.toLowerCase().includes(c.forn?.toLowerCase());
      const valorMatch=Math.abs(Number(c.val)-comp.valor)<0.02;
      return nomeMatch&&valorMatch;
    });

    // Se não casou por nome+valor, tenta só por valor
    if(!contasCasadas.length){
      contasCasadas=contasAbertas.filter(c=>Math.abs(Number(c.val)-comp.valor)<0.02);
    }

    // Dá baixa nas contas casadas
    let totalBaixado=0;
    let fornecedoresBaixados=[];
    if(contasCasadas.length>0){
      contasCasadas.forEach(c=>{
        c.pago=true;
        c.pagoEm=comp.data||hj();
        c.pag=comp.tipo||"pix";
        c.autenticacao=comp.autenticacao||"";
        totalBaixado+=Number(c.val);
        if(!fornecedoresBaixados.includes(c.forn))fornecedoresBaixados.push(c.forn);
      });

      // Lança no DRE como saída
      if(!db[hj()])db[hj()]={r:[],c:[]};
      db[hj()].c.push({
        id:uid(),
        d:`Pagto ${comp.tipo?.toUpperCase()||"PIX"} ${fornecedoresBaixados.join("/")}`,
        cat:"Insumos/Matéria-prima",s:"",v:comp.valor
      });
      sdb(db);
    }

    // Atualiza item na fila com resultado
    const idx=fila.findIndex(f=>f.id===itemComp.id);
    if(idx>=0){
      fila[idx].status="pronto";
      fila[idx].fornecedor=comp.favorecido||"Comprovante";
      fila[idx].valor=comp.valor;
      fila[idx].data=comp.data||hj();
      fila[idx].tipoDoc="comprovante";
      fila[idx]._baixas=contasCasadas.length;
      fila[idx]._fornecedoresBaixados=fornecedoresBaixados;
      fila[idx]._aviso=contasCasadas.length===0?
        `⚠️ Nenhuma conta encontrada para ${comp.favorecido} R$ ${comp.valor}. Verifique as contas a pagar.`:
        `✅ ${contasCasadas.length} conta(s) baixada(s): ${fornecedoresBaixados.join(", ")}`;
    }

  }catch(e){
    const idx=fila.findIndex(f=>f.id===itemComp.id);
    if(idx>=0){fila[idx].status="erro";fila[idx].erro=e.message;fila[idx].fornecedor="Erro comprovante";}
  }
  sFila(fila);render();
}
function gMemoria(){const d=ldb();if(!d.memoriaForn)d.memoriaForn={};return d.memoriaForn;}
function sMemoria(m){const d=ldb();d.memoriaForn=m;sdb(d);}

function buscarMemoriaProduto(fornecedor, descricao){
  const mem=gMemoria();
  const key=fornecedor?.toLowerCase()||"";
  const prod=descricao?.toLowerCase()||"";
  if(!mem[key])return null;
  // Busca por similaridade
  const match=Object.keys(mem[key]).find(k=>
    prod.includes(k)||k.includes(prod)||
    prod.replace(/\s+/g,"").includes(k.replace(/\s+/g,""))
  );
  return match?mem[key][match]:null;
}

function salvarMemoriaProduto(fornecedor, descricao, upc){
  const mem=gMemoria();
  const key=fornecedor?.toLowerCase()||"";
  const prod=descricao?.toLowerCase()||"";
  if(!mem[key])mem[key]={};
  mem[key][prod]=upc;
  sMemoria(mem);
}

async function processarFila(){
  const fila=gFila();
  const pendentes=fila.filter(f=>f.status==="pendente"&&f.imagem);
  if(!pendentes.length){alert("Nenhuma NF pendente para processar!");return;}

  for(const item of pendentes){
    item.status="processando";
    item.etapa="1/4 Extraindo texto...";
    sFila(fila);render();

    try{
      // ═══ ETAPA 1: Extrai texto completo ═══
      item.etapa="1/4 Extraindo texto...";
      sFila(fila);
      const e1=await claudeAPI({
        model:MODEL, max_tokens:3500,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:"image/jpeg",data:item.imagem}},
          {type:"text",text:`Transcreva TODO o texto desta nota fiscal brasileira.
FOQUE EM:
1. "VALOR A COBRAR" — canto superior direito
2. "FAT" ou "FATURA" — data de vencimento abaixo do município  
3. Tabela de produtos — CADA LINHA COMPLETA com: descrição, qtd, unidade, V.UNIT, V.TOTAL
4. Emitente (fornecedor) — bloco superior direito
5. Número da NF e série

Transcreva linha por linha da tabela de produtos sem omitir nada.`}
        ]}]
      });
      const texto=(e1.content||[]).map(b=>b.text||"").join("").trim();
      if(!texto||texto.length<50)throw new Error("Texto ilegível — tente nova foto");
      item.textoOriginal=texto;

      // ═══ ETAPA 2: Identifica tipo e valida completude ═══
      item.etapa="2/4 Identificando documento...";
      sFila(fila);
      const e2=await claudeAPI({
        model:MODEL, max_tokens:500,
        messages:[{role:"user",content:`Analise este texto de documento fiscal brasileiro e responda SOMENTE JSON:
{"tipo":"nf|cupom|recibo|boleto|comprovante_pix|extrato","num_itens_detectados":0,"tem_valor_cobrar":true,"tem_vencimento":true,"qualidade":"boa|media|ruim","obs":""}

TEXTO:
${texto.slice(0,2000)}`}]
      });
      const t2txt=(e2.content||[]).map(b=>b.text||"").join("").trim();
      const t2m=t2txt.match(/\{[\s\S]*\}/);
      const tipo=t2m?JSON.parse(t2m[0]):{tipo:"nf",qualidade:"media"};
      item.tipoDoc=tipo.tipo;
      if(tipo.qualidade==="ruim"){
        item.status="erro";item.erro="Qualidade baixa — tire nova foto com melhor iluminação";
        sFila(fila);continue;
      }

      // ═══ ETAPA 3: Extrai dados estruturados ═══
      item.etapa="3/4 Extraindo dados...";
      sFila(fila);

      // Aplica memória de produtos do fornecedor
      const memForn=gMemoria()[item.fornecedor?.toLowerCase()||""]||{};
      const memStr=Object.keys(memForn).length>0
        ?`\nMEMÓRIA DE PRODUTOS DESTE FORNECEDOR (use para confirmar upc):\n${Object.entries(memForn).map(([k,v])=>`${k}: ${v} un/cx`).join("\n")}`:"";

      const e3=await claudeAPI({
        model:MODEL, max_tokens:3000,
        system:`Interprete texto de nota fiscal brasileira com MÁXIMA PRECISÃO.
REGRAS CRÍTICAS:
1. Cada linha de produto = item separado. NUNCA una produtos diferentes.
2. Formato NxM = unidades por caixa: 12X1→upc:12, 6X1→upc:6, 24X1→upc:24
3. Vencimento: campo FAT/FATURA abaixo do município. NÃO use data de emissão.
4. Valor total da NF: VALOR A COBRAR do cabeçalho/rodapé
5. Quantidade: coluna QTD (ex: 1,000 = 1; 2,000 = 2)
6. valor_unitario: coluna "V. UNIT." = preço unitário por caixa SEM imposto
7. valor_total do item: use a ÚLTIMA COLUNA numérica da linha = valor COM imposto (ST, ICMS-ST incluso). Esta é a coluna "VALOR TOTAL" ou "VL TOTAL" que aparece no final da linha, APÓS as colunas de imposto. É o valor que você efetivamente paga por aquele item.
8. Descrição: leia EXATAMENTE como está. 510ML≠310ML, PT2L=2L, PT1L=1L
9. Converta BR: vírgula=decimal, ponto=milhar

JSON: {"fornecedor":"","cnpj":"","numero":"","data":"DD/MM/AAAA","vencimento":"DD/MM/AAAA","valor_total":0.00,"itens":[{"descricao":"","quantidade":0,"unidade":"cx","unidades_por_cx":1,"valor_unitario":0.00,"valor_total":0.00}]}`,
        messages:[{role:"user",content:`Extraia dados desta NF. Para valor_total de cada item use a ÚLTIMA COLUNA da tabela (valor com imposto).${memStr}\n\nTEXTO:\n${texto}`}]
      });
      const t3txt=(e3.content||[]).map(b=>b.text||"").join("").trim();
      const t3m=t3txt.match(/\{[\s\S]*\}/);
      if(!t3m)throw new Error("Não consegui interpretar os dados");
      const dados=JSON.parse(t3m[0]);

      // ═══ ETAPA 4: Valida consistência ═══
      item.etapa="4/4 Validando...";
      sFila(fila);
      const somaItens=dados.itens?.reduce((a,it)=>a+(it.valor_total||0),0)||0;
      const diffPct=dados.valor_total>0?Math.abs(somaItens-dados.valor_total)/dados.valor_total:0;
      // Se diferença > 15%, avisa mas não bloqueia
      dados._aviso_valor=diffPct>0.15?`Soma dos itens (${brl(somaItens)}) difere do total (${brl(dados.valor_total)})`:null;

      // Aplica memória de UPC para produtos conhecidos
      if(dados.itens){
        dados.itens=dados.itens.map(it=>{
          const memUpc=buscarMemoriaProduto(dados.fornecedor,it.descricao);
          if(memUpc&&memUpc!==it.unidades_por_cx){
            it.unidades_por_cx=memUpc;
            it._memoria=true;
          }
          return it;
        });
      }

      // Atualiza item com dados completos
      item.status="revisao"; // aguarda revisão antes de marcar pronto
      item.fornecedor=dados.fornecedor||"Fornecedor";
      item.cnpj=dados.cnpj||"";
      item.numero=dados.numero||"";
      item.data=dados.data||"";
      item.vencimento=dados.vencimento||"";
      item.valor=dados.valor_total||0;
      item.itens=dados.itens||[];
      item.avisovalor=dados._aviso_valor;
      item.etapa="Aguardando revisão";

    }catch(e){
      item.status="erro";
      item.erro=e.message;
      item.etapa="";
    }
    sFila(fila);render();
    await new Promise(r=>setTimeout(r,500));
  }
  render();
}

// Lança todas as NFs prontas de uma vez
function lancarFila(){
  const fila=gFila();
  const prontos=fila.filter(f=>f.status==="pronto");
  if(!prontos.length)return;

  const db=ldb();
  if(!db[hj()])db[hj()]={r:[],c:[]};
  if(!db.est)db.est=[];
  if(!db.contasPagar)db.contasPagar=[];

  let totalLancado=0;
  let itensEstoque=0;
  let contasPagar=0;

  prontos.forEach(item=>{
    if(!item.valor||item.valor<=0)return;

    // 1. Custo no DRE
    const desc=item.fornecedor?`NF ${item.fornecedor}${item.numero?" nº"+item.numero:""}`:"NF Digitalizada";
    db[hj()].c.push({id:uid(),d:desc,cat:"Insumos/Matéria-prima",s:"",v:item.valor});
    totalLancado+=item.valor;

    // 2. Conta a pagar
    db.contasPagar.push({
      id:uid(),forn:item.fornecedor||"Fornecedor",
      val:item.valor,venc:converterDataParaInput(item.vencimento||item.data),
      pag:"boleto",pago:false,nf:item.numero||"",
      semana:semana(),dt:hj()
    });
    contasPagar++;

    // 3. Itens no estoque com FIFO
    (item.itens||[]).forEach(it=>{
      if(!it.descricao||!it.quantidade)return;
      const upc=it.unidades_por_cx||1;
      const qtdCx=it.quantidade;
      const qtdUn=qtdCx*upc;
      const cuPorCx=it.valor_unitario||0;
      const cuPorUn=upc>1?cuPorCx/upc:cuPorCx;
      const ex=db.est.find(e=>e.n.toLowerCase()===it.descricao.toLowerCase());
      if(ex){
        ex.q+=qtdCx;ex.qi+=qtdCx;
        ex.qun=(ex.qun||0)+qtdUn;
        ex.upc=upc;
        if(!ex.lotes)ex.lotes=[];
        const cuAnterior=ex.cu||0;
        ex.lotes.push({qtdCx,qtdUn,cuPorCx,cuPorUn,dt:hj(),nf:item.numero||""});
        ex.cuAnterior=cuAnterior;
        ex.cu=cuPorUn;
      }else{
        db.est.push({
          id:uid(),n:it.descricao,u:"cx",
          q:qtdCx,qi:qtdCx,qun:qtdUn,upc,
          cu:cuPorUn,cuAnterior:cuPorUn,
          lotes:[{qtdCx,qtdUn,cuPorCx,cuPorUn,dt:hj(),nf:item.numero||""}],
          min:0,s:[],perdas:[]
        });
      }
      itensEstoque++;
    });

    // Remove da fila após lançar
    item.status="lançado";
  });

  sdb(db);

  // Limpa lançados da fila
  sFila(fila.filter(f=>f.status!=="lançado"));

  alert(`✅ Lançamento concluído!\n\n💰 Total: ${brl(totalLancado)}\n📋 Contas a pagar: ${contasPagar}\n📦 Itens no estoque: ${itensEstoque}`);
  render();
}

// Importa relatório iFood Excel
async function importarIfoodExcel(inp){
  const f=inp?.files?.[0]; if(!f)return; inp.value="";
  const res=document.getElementById("ifood-excel-res");
  if(res)res.innerHTML=`<div class="ial ay"><span>⟳</span><span>Carregando...</span></div>`;
  try{
    // Carrega SheetJS só quando necessário
    if(!window.XLSX){
      await new Promise((ok,err)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload=ok; s.onerror=err;
        document.head.appendChild(s);
      });
    }
    if(res)res.innerHTML=`<div class="ial ay"><span>⟳</span><span>Processando...</span></div>`;
    const buf=await f.arrayBuffer();
    const wb=window.XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=window.XLSX.utils.sheet_to_json(ws,{defval:""});
    if(!rows.length)throw new Error("Arquivo vazio");

    const db=ldb(); const resumo={};
    rows.forEach(row=>{
      const status=String(row["STATUS FINAL DO PEDIDO"]||"");
      if(!status.includes("CONCLU"))return;
      const dtHora=String(row["DATA E HORA DO PEDIDO"]||"").split(" ")[0]||"";
      if(!dtHora)return;
      const loja=row["NOME DA LOJA"]||"iFood";
      const vendas=parseFloat(row["VALOR DOS ITENS (R$)"]||0);
      const taxas=Math.abs(parseFloat(row["TAXAS E COMISSOES (R$)"]||0));
      const liquido=parseFloat(row["VALOR LIQUIDO (R$)"]||0);
      const promoLoja=Math.abs(parseFloat(row["INCENTIVO PROMOCIONAL DA LOJA (R$)"]||0));
      const key=`${dtHora}||${loja}`;
      if(!resumo[key])resumo[key]={data:dtHora,loja,vendas:0,taxas:0,liquido:0,promoLoja:0,pedidos:0};
      resumo[key].vendas+=vendas; resumo[key].taxas+=taxas;
      resumo[key].liquido+=liquido; resumo[key].promoLoja+=promoLoja;
      resumo[key].pedidos++;
    });

    let tv=0,tt=0,tl=0;
    Object.values(resumo).forEach(r=>{
      const dia=r.data; if(!db[dia])db[dia]={r:[],c:[]};
      db[dia].r=db[dia].r.filter(x=>x.fonte!=="ifood");
      db[dia].c=db[dia].c.filter(x=>x.fonte!=="ifood_taxa"&&x.fonte!=="ifood_promo");
      if(r.vendas>0)db[dia].r.push({id:uid(),d:`iFood ${r.loja} (${r.pedidos} ped.)`,s:detectarSegmentoLoja(r.loja),v:r.vendas,fonte:"ifood"});
      if(r.taxas>0)db[dia].c.push({id:uid(),d:`Taxa iFood ${r.loja}`,cat:"Delivery (taxas)",s:detectarSegmentoLoja(r.loja),v:r.taxas,fonte:"ifood_taxa"});
      if(r.promoLoja>0)db[dia].c.push({id:uid(),d:`Promoção iFood ${r.loja}`,cat:"Marketing",s:detectarSegmentoLoja(r.loja),v:r.promoLoja,fonte:"ifood_promo"});
      tv+=r.vendas; tt+=r.taxas; tl+=r.liquido;
    });
    sdb(db);
    const dias=Object.keys(resumo).length;
    if(!dias)throw new Error("Nenhum pedido CONCLUÍDO encontrado");
    if(res)res.innerHTML=`<div class="ial ag"><span>✅</span><span>${dias} dia(s) · Vendas: ${brl(tv)} · Taxas: ${brl(tt)} · Líquido: ${brl(tl)}</span></div>`;
    render();
  }catch(e){
    if(res)res.innerHTML=`<div class="ial ar"><span>❌</span><span>${e.message}</span></div>`;
  }
}

function detectarSegmentoLoja(nome){
  const n=(nome||"").toLowerCase();
  if(n.includes("pizza"))return"pizzaria";
  if(n.includes("espet"))return"espetaria";
  if(n.includes("hamburguer")||n.includes("burger"))return"hamburgueria";
  if(n.includes("bar"))return"bar";
  return"restaurante";
}

async function importarSTi3(inp){

  if(res)res.innerHTML=`<div class="ial ay"><span>⟳</span><span>Lendo arquivo...</span></div>`;
  try{

      system:`Leia este relatório de vendas do STi3 (PDV brasileiro) e retorne SOMENTE JSON:
{"data":"DD/MM/AAAA","lojas":[{"nome":"","vendas_total":0.00,"vendas_dinheiro":0.00,"vendas_cartao":0.00,"vendas_pix":0.00,"cancelamentos":0.00}],"total_geral":0.00}`,

async function sincronizarIfood(){

  if(res)res.innerHTML=`<div class="ial ay"><span>⟳</span><span class="pu">Conectando ao iFood...</span></div>`;

    const cfg=JSON.parse(localStorage.getItem("erp_ifood")||"{}");
    if(!cfg.clientId)throw new Error("Configure o iFood em ⚙️ Config primeiro");
    const rsp=await fetch("/api/ifood",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"vendas",clientId:cfg.clientId,clientSecret:cfg.clientSecret,data:hj()})
    });
    if(!rsp.ok)throw new Error("Erro "+rsp.status+" — verifique as credenciais");
    const dados=await rsp.json();

    // Lança vendas e taxas no DRE

    let totalVendas=0;let totalTaxas=0;
    (dados.lojas||[]).forEach(loja=>{
      if(loja.vendas>0){

// Comprime imagem antes de enviar
async function comprimirImagem(file, maxW=1800, maxH=1800, qualidade=0.92){
  return new Promise((resolve)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img;
      // Se imagem está na horizontal (paisagem), rotaciona 90° para ficar vertical
      const girar = w > h * 1.2;
      let fw = girar ? h : w;
      let fh = girar ? w : h;
      // Redimensiona mantendo proporção
      if(fw>maxW){fh=Math.round(fh*maxW/fw);fw=maxW;}
      if(fh>maxH){fw=Math.round(fw*maxH/fh);fh=maxH;}
      const c=document.createElement("canvas");
      c.width=fw; c.height=fh;
      const ctx=c.getContext("2d");
      if(girar){
        // Rotaciona 90° sentido horário
        ctx.translate(fw,0);
        ctx.rotate(Math.PI/2);
        ctx.filter='contrast(1.15) brightness(1.05) saturate(0.9)';
        ctx.drawImage(img,0,0,fh,fw);
      }else{
        ctx.filter='contrast(1.15) brightness(1.05) saturate(0.9)';
        ctx.drawImage(img,0,0,fw,fh);
      }
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg",qualidade).split(",")[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}

// Converte data DD/MM/YYYY para YYYY-MM-DD (input date)
function converterDataParaInput(dtBR){
  if(!dtBR)return"";
  const p=dtBR.split("/");
  if(p.length===3)return`${p[2]}-${p[1]}-${p[0]}`;
  return"";
}

function lnf(){
  const t=document.getElementById("nft")?.value||"c";
  const cat=document.getElementById("nfc")?.value||"Insumos/Matéria-prima";
  const seg=document.getElementById("nfs")?.value||"";
  // Usa valores editados se disponíveis
  const fornEdit=document.getElementById("ed-forn")?.value?.trim()||fd?.fornecedor||"";
  const val=parseFloat(document.getElementById("ed-valor")?.value||document.getElementById("nfv")?.value);
  if(!val||val<=0){alert("Verifique o valor — deve ser maior que zero!");return;}
  // Atualiza fd com correções do usuário
  if(fd){
    if(fornEdit)fd.fornecedor=fornEdit;
    fd.valor_total=val;
  }

  const db=ldb();
  if(!db[hj()])db[hj()]={r:[],c:[]};
  if(!db.est)db.est=[];
  if(!db.forn)db.forn=[];
  if(!db.contasPagar)db.contasPagar=[];

  const desc=fd?.fornecedor?`NF ${fd.tipo_documento==="boleto"?"Boleto":""}${fd.fornecedor}`:"Nota Fiscal";

  if(t==="c"||t==="a"){
    db[hj()].c.push({id:uid(),d:desc,cat,s:seg,v:val});
  }

  if(t==="e"||t==="a"){
    const selProd=document.getElementById("nfpsel")?.value;
    const qtd=parseFloat(document.getElementById("nfq")?.value)||0;

    if(selProd&&selProd!=="_novo"){
      // produto existente
      const prod=db.est.find(e=>e.id===selProd);
      if(prod&&qtd>0){
        const cu=val/qtd;
        prod.q+=qtd;prod.qi+=qtd;
        if(cu)prod.cu=cu;
      }else if(!qtd){alert("Informe a quantidade!");}
    }else{
      // novo produto
      const nome=document.getElementById("nfp")?.value?.trim();
      const unid=document.getElementById("nfu")?.value||"kg";
      const min=parseFloat(document.getElementById("nfmin")?.value)||0;
      if(!nome){alert("Informe o nome do produto!");return;}
      if(!qtd){alert("Informe a quantidade!");return;}
      const cu=qtd>0?val/qtd:0;
      const ex=db.est.find(e=>e.n.toLowerCase()===nome.toLowerCase());
      if(ex){ex.q+=qtd;ex.qi+=qtd;if(cu)ex.cu=cu;if(min)ex.min=min;}
      else db.est.push({id:uid(),n:nome,u:unid,q:qtd,qi:qtd,cu,min,s:[],perdas:[]});
    }
  }

  if(t==="cp"){
    const forn=document.getElementById("nfforn")?.value?.trim()||fd?.fornecedor||"Fornecedor";
    const venc=document.getElementById("nfvenc")?.value;
    const pag=document.getElementById("nfpag")?.value||"boleto";
    db.contasPagar.push({id:uid(),forn,val,venc,pag,pago:false,nf:fd?.numero||"",semana:semana(),dt:hj()});
  }

  sdb(db);rnf();ir("dre");
}

// Processa texto colado do CamScanner
async function processarTextoNF(){
  const texto=document.getElementById("txt-nf")?.value?.trim();
  if(!texto||texto.length<20){alert("Cole o texto da NF primeiro!");return;}
  fs="loading"; fd=null; render();
  try{
    const data=await claudeAPI({
      model:MODEL,
      max_tokens:2000,
      system:PROMPT_OCR_SYSTEM,
      messages:[{role:"user",content:`${PROMPT_OCR_USER}\n\nTEXTO COMPLETO DA NOTA FISCAL:\n${texto}`}]
    });
    const txt=(data.content||[]).map(b=>b.text||"").join("").trim();
    const jsonMatch=txt.match(/\{[\s\S]*\}/);
    if(!jsonMatch)throw new Error("Não consegui interpretar o texto.");
    const parsed=JSON.parse(jsonMatch[0]);
    if(parsed.valor_total<0)parsed.valor_total=0;
    parsed.itens=(parsed.itens||[]).filter(it=>it.descricao&&it.descricao.trim());
    parsed._textoOCR=true;
    fd=parsed; fs="done"; fd._autoLancado=false;
  }catch(e){
    fd=e.message; fs="erro";
  }
  render();
}

// Adiciona foto só dos itens ao resultado já lido
async function adicionarFotoItens(inp){
  const f=inp?.files?.[0]; if(!f)return; inp.value="";
  // Mostra loading mas mantém dados do cabeçalho
  const dadosAnteriores={...fd};
  fs="loading"; render();

  const msgs=["Lendo itens da NF...","Identificando produtos...","Extraindo quantidades..."];
  let mi=0;
  const iv=setInterval(()=>{mi=(mi+1)%msgs.length;const el=document.getElementById("nfm");if(el)el.textContent=msgs[mi];},900);

  try{
    const b64=await comprimirImagem(f,2000,2000,0.95);
    const data=await claudeAPI({
      model:MODEL,
      max_tokens:2000,
      system:`Você lê tabelas de itens de Nota Fiscal brasileira.
Extraia TODOS os produtos da tabela "DADOS DO PRODUTO/SERVIÇO".
Para cada item leia: descrição completa, quantidade, unidade, valor unitário, valor total.
Responda SOMENTE JSON: {"itens":[{"descricao":"","quantidade":0,"unidade":"un","valor_unitario":0.00,"valor_total":0.00}],"valor_total_itens":0.00}`,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:"Leia TODOS os itens desta tabela de NF. Extraia descrição completa, quantidade, unidade e valores de cada produto."}
      ]}]
    });

    clearInterval(iv);
    const txt=(data.content||[]).map(b=>b.text||"").join("").trim();
    const jsonM=txt.match(/\{[\s\S]*\}/);
    if(!jsonM)throw new Error("Não encontrei itens na imagem");
    const res=JSON.parse(jsonM[0]);

    // Mescla itens novos com dados anteriores
    fd={...dadosAnteriores, itens: res.itens||[]};
    fs="done";
  }catch(e){
    clearInterval(iv);
    fd=dadosAnteriores; // restaura dados anteriores
    fs="done";
    setTimeout(()=>{alert("Erro ao ler itens: "+e.message);},100);
  }
  render();
}

function ivoz(txt){
const db=ldb();if(!db[hj()])db[hj()]={r:[],c:[]};if(!db.est)db.est=[];
const nums=txt.match(/(\d+[\.,]?\d*)/g)||[];const qtd=nums.length?parseFloat(nums[0].replace(",",".")):0;const val=nums.length>1?parseFloat(nums[nums.length-1].replace(",",".")):0;
const unidM=txt.match(/(kg|kilos?|quilos?|litros?|unidades?|caixas?|l\b)/i);const unid=unidM?unidM[1].replace(/quilo|kilo/g,"kg").replace(/s$/,"").replace(/litro/,"L"):("kg");
const sg=SEGS.find(s=>txt.includes(s.id)||txt.includes(s.n.toLowerCase())||(s.id==="espetaria"&&(txt.includes("espeto")||txt.includes("espetaria")))||(s.id==="hamburgueria"&&(txt.includes("hamburguer")||txt.includes("lanch")))||(s.id==="bar"&&txt.includes("bar"))||(s.id==="pizzaria"&&txt.includes("pizza")));
const stopwords=["saída","saida","entrada","receita","custo","perda","fornecedor","reais","real","kg","kilo","litro","quilo",sg?.n?.toLowerCase()||"","..."].concat(SEGS.map(s=>s.n.toLowerCase()));
const palavras=txt.split(/\s+/).filter(w=>w.length>2&&!stopwords.some(sw=>sw&&w.includes(sw))&&!/^\d/.test(w));
const nomeProd=palavras.slice(0,2).join(" ")||"Produto";
let acao="";

if(txt.includes("saída")||txt.includes("saida")||txt.includes("retirada")){
  const prod=db.est.find(e=>txt.includes(e.n.toLowerCase()));
  if(prod&&qtd>0&&sg){const cs=qtd*(prod.cu||0);prod.q=Math.max(0,prod.q-qtd);if(!prod.s)prod.s=[];prod.s.push({sid:sg.id,sn:sg.n,si:sg.i,q:qtd,dt:hj()});db[hj()].c.push({id:uid(),d:`Saída ${prod.n}→${sg.n}`,cat:"Insumos/Matéria-prima",s:sg.id,v:cs});sdb(db);acao=`<div class="ial ag">✅ Saída ${qtd}${unid} <b>${prod.n}</b>→<b>${sg.n}</b> · ${brl(cs)}</div>`;}
  else if(!prod)acao=`<div class="ial ay">⚠️ "${nomeProd}" não encontrado no estoque.</div>`;
  else if(!sg)acao=`<div class="ial ay">⚠️ Segmento não identificado.</div>`;
}else if(txt.includes("perda")||txt.includes("quebra")||txt.includes("estrago")){
  const prod=db.est.find(e=>txt.includes(e.n.toLowerCase()));
  if(prod&&qtd>0){const cp=qtd*(prod.cu||0);prod.q=Math.max(0,prod.q-qtd);if(!prod.perdas)prod.perdas=[];prod.perdas.push({q:qtd,cu:prod.cu||0,dt:hj()});db[hj()].c.push({id:uid(),d:`Perda ${prod.n}`,cat:"Outros variáveis",s:"",v:cp});sdb(db);acao=`<div class="ial ao">⚠️ Perda: ${qtd}${unid} <b>${prod.n}</b> · ${brl(cp)}</div>`;}
  else acao=`<div class="ial ay">⚠️ Produto não encontrado.</div>`;

async function iniciarConferencia(inp, origem) {
  const f = inp?.files?.[0];
  if (!f) return;
  inp.value = '';
  confState = { itens: [], fase: 'loading' };
  ir('conf');

  const msgs = ['Analisando imagem...', 'Identificando produtos...', 'Contando quantidades...', 'Comparando com estoque...'];
  let mi = 0;
  const iv = setInterval(() => {
    mi = (mi + 1) % msgs.length;
    const el = document.getElementById('conf-msg');
    if (el) el.textContent = msgs[mi];
  }, 1000);

  try {
    const b64 = await comprimirImagem(f);
    const est = gest();

    const produtosExistentes = est.length > 0
      ? `\n\nPRODUTOS JÁ NO SISTEMA (tente casar com esses nomes):\n${est.map(e => `- ${e.n} (${e.u})`).join('\n')}`
      : '';

    const data = await claudeAPI({
      model: MODEL,
      max_tokens: 1200,
      system: `Você é um especialista em conferência de estoque para restaurantes brasileiros.
Analise a imagem e identifique TODOS os produtos visíveis com suas quantidades.

REGRAS:
1. Conte embalagens, pacotes, caixas, itens visíveis
2. Para produtos a granel (carnes, queijos), estime o peso em kg
3. Para líquidos, use L ou ml
4. Para unidades contáveis, use "un"
5. Seja preciso nos nomes — use nomes comerciais comuns no Brasil
6. Se não conseguir ler o produto, descreva o que vê

Responda SOMENTE com JSON válido:
{"itens":[{"nome":"","quantidade":0,"unidade":"un","confianca":"alta|media|baixa","obs":""}],"ambiente":"geladeira|freezer|prateleira|outro","obs_geral":""}`,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
          { type: 'text', text: `Faça a conferência completa deste estoque de restaurante.${produtosExistentes}` }
        ]
      }]
    });

    clearInterval(iv);
    const txt = (data.content || []).map(b => b.text || '').join('').trim();
    const jsonM = txt.match(/\{[\s\S]*\}/);
    if (!jsonM) throw new Error('Resposta inválida da IA');
    const res = JSON.parse(jsonM[0]);

    // Casar itens com estoque existente
    const itensProcessados = (res.itens || []).map(it => {
      const prodMatch = est.find(e =>
        e.n.toLowerCase() === it.nome.toLowerCase() ||
        e.n.toLowerCase().includes(it.nome.toLowerCase()) ||
        it.nome.toLowerCase().includes(e.n.toLowerCase())
      );
      return {
        nome: it.nome,
        qtdNova: it.quantidade || 0,
        unid: it.unidade || 'un',
        confianca: it.confianca || 'media',
        obs: it.obs || '',
        prodId: prodMatch?.id || null,
        _excluir: false
      };
    });

    confState = { itens: itensProcessados, fase: 'revisar', ambiente: res.ambiente };

  } catch (e) {
    clearInterval(iv);
    confState = { itens: [], fase: 'idle' };
    ir('conf');
    setTimeout(() => {
      const main = document.getElementById('main');
      if (main) main.innerHTML = `<div class="si"><div class="ial ar"><span>❌</span><span>${e.message}</span></div><button onclick="confState={itens:[],fase:'idle'};ir('conf');" class="bok" style="margin-top:8px;">🔄 Tentar Novamente</button></div>`;
    }, 50);
    return;
  }
  ir('conf');
}

function confAplicar() {
  const db = ldb();
  if (!db.est) db.est = [];
  const itensAtivos = confState.itens.filter(it => !it._excluir && it.qtdNova >= 0);
  let atualizados = 0, novos = 0, ignorados = 0;
  const diferencas = [];

  itensAtivos.forEach(it => {
    if (!it.nome.trim()) { ignorados++; return; }
    const ex = it.prodId
      ? db.est.find(e => e.id === it.prodId)
      : db.est.find(e => e.n.toLowerCase() === it.nome.toLowerCase());

    if (ex) {
      const antes = ex.q;
      const diff = it.qtdNova - antes;
      if (Math.abs(diff) > 0.001) {
        diferencas.push({ nome: ex.n, antes, depois: it.qtdNova, diff });
      }
      ex.q = it.qtdNova;
      if (!ex.qi || ex.qi < it.qtdNova) ex.qi = it.qtdNova;
      atualizados++;
    } else {
      db.est.push({ id: uid(), n: it.nome.trim(), u: it.unid, q: it.qtdNova, qi: it.qtdNova, cu: 0, min: 0, s: [], perdas: [] });
      novos++;
    }
  });

  confState.itens.filter(it => it._excluir).forEach(() => ignorados++);
  sdb(db);

  confState = { itens: [], fase: 'aplicado', resultado: { atualizados, novos, ignorados, diferencas } };
  ir('conf');
}

let scanStream=null, scanFlash=false;

async function abrirScanner(){
  const box=document.getElementById("scanner-box");
  const video=document.getElementById("scan-video");
  if(!box||!video)return;
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}
    });
    video.srcObject=scanStream;
    box.style.display="block";
    box.scrollIntoView({behavior:"smooth"});
    iniciarDeteccaoBordas();
  }catch(e){
    alert("Câmera não disponível: "+e.message+"\n\nUse 'Importar da Galeria'.");
  }
}

function fecharScanner(){
  if(scanStream)scanStream.getTracks().forEach(t=>t.stop());
  scanStream=null;
  const box=document.getElementById("scanner-box");
  if(box)box.style.display="none";
}

function alternarFlash(){
  if(!scanStream)return;
  const track=scanStream.getVideoTracks()[0];
  scanFlash=!scanFlash;
  track.applyConstraints({advanced:[{torch:scanFlash}]}).catch(()=>{
    alert("Flash não disponível neste dispositivo");
    scanFlash=false;
  });
}

function iniciarDeteccaoBordas(){
  const video=document.getElementById("scan-video");
  const dica=document.getElementById("scan-dica");
  if(!video||!dica)return;
  const check=()=>{
    if(!scanStream||!document.getElementById("scanner-box"))return;
    // Detecta luminosidade
    const vw=video.videoWidth||640;
    const vh=video.videoHeight||480;
    const c=document.createElement("canvas");
    c.width=64;c.height=64;
    const ctx=c.getContext("2d");
    ctx.drawImage(video,0,0,64,64);
    const d=ctx.getImageData(0,0,64,64).data;
    let lum=0;
    for(let i=0;i<d.length;i+=4)lum+=(d[i]+d[i+1]+d[i+2])/3;
    lum/=(d.length/4);
    if(lum<50){dica.textContent="⚠️ Muito escuro — acenda a luz";dica.style.background="rgba(255,136,0,0.8)";}
    else if(lum>210){dica.textContent="⚠️ Reflexo — mude o ângulo";dica.style.background="rgba(255,136,0,0.8)";}
    else{dica.textContent="✅ Capture quando estiver nítido";dica.style.background="rgba(0,0,0,0.6)";}
    setTimeout(check,1000);
  };
  video.onloadedmetadata=()=>setTimeout(check,500);
}

function capturarScanner(){
  const video=document.getElementById("scan-video");
  if(!video||!scanStream)return;
  // Captura frame do video
  const c=document.createElement("canvas");
  c.width=video.videoWidth||1280;
  c.height=video.videoHeight||720;
  const ctx=c.getContext("2d");
  // Melhora contraste para documentos
  ctx.filter="contrast(1.2) brightness(1.05) saturate(0.8)";
  ctx.drawImage(video,0,0,c.width,c.height);
  fecharScanner();
  // Converte para blob e processa como se fosse foto
  c.toBlob(blob=>{
    const file=new File([blob],"scan.jpg",{type:"image/jpeg"});
    processarArquivoNF(file);
  },"image/jpeg",0.92);
}

// Função central de processamento
async function processarArquivoNF(file){
  fs="loading"; fd=null; render();
  const scanId=Date.now();

  const setMsg=(m,s="")=>{
    const el=document.getElementById("nfm");
    const sub=document.getElementById("nfsub");
    if(el)el.textContent=m;
    if(sub)sub.textContent=s;
  };

  try{
    setMsg("Preparando imagem...","Otimizando para leitura");

    // Envia em máxima resolução para a IA ler melhor
    const b64=await comprimirImagem(file,2400,2400,0.95);
    if(!b64)throw new Error("Não foi possível processar a imagem");

    setMsg("Lendo documento...","IA analisando");

    const data=await claudeAPI({
      model:MODEL,
      max_tokens:2000,
      system:PROMPT_OCR_SYSTEM,
      messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
        {type:"text",text:`${PROMPT_OCR_USER}\n\nID: ${scanId}`}
      ]}]
    });

    const txt=(data.content||[]).map(b=>b.text||"").join("").trim();
    const jsonMatch=txt.match(/\{[\s\S]*\}/);
    if(!jsonMatch)throw new Error("Resposta inválida. Tente novamente.");
    const parsed=JSON.parse(jsonMatch[0]);
    if(parsed.valor_total<0)parsed.valor_total=0;
    parsed.itens=(parsed.itens||[]).filter(it=>it.descricao&&it.descricao.trim());
    fd=parsed; fs="done";
    fd._autoLancado=false;

  }catch(e){
    fd=e.message||"Erro desconhecido";
    fs="erro";
  }
  render();
}

// Tenta lançar automaticamente quando confiança é alta
function tentarAutoLancamento(d){
  if(!d||!d.valor_total||d.valor_total<=0)return;
  const db=ldb();
  if(!db[hj()])db[hj()]={r:[],c:[]};
  if(!db.est)db.est=[];
  if(!db.contasPagar)db.contasPagar=[];
  // 1. Lança custo no DRE
  const desc=d.fornecedor?`${d.tipo_documento==="nf"?"NF":"Doc"} ${d.fornecedor}`:"Documento escaneado";
  db[hj()].c.push({id:uid(),d:desc,cat:"Insumos/Matéria-prima",s:"",v:d.valor_total});
  // 2. Lança conta a pagar se tem fornecedor
  if(d.fornecedor){
    db.contasPagar.push({
      id:uid(),forn:d.fornecedor,val:d.valor_total,
      venc:d.data_vencimento?converterDataParaInput(d.data_vencimento):"",
      pag:"boleto",pago:false,nf:d.numero||"",semana:semana(),dt:hj()
    });
  }
  // 3. Entrada no estoque para cada item identificado
  if(d.itens?.length){
    d.itens.forEach(it=>{
      if(!it.descricao||!it.quantidade)return;
      const cu=it.valor_unitario||0;
      const ex=db.est.find(e=>e.n.toLowerCase()===it.descricao.toLowerCase());
      if(ex){ex.q+=it.quantidade;ex.qi+=it.quantidade;if(cu)ex.cu=cu;}
      else db.est.push({id:uid(),n:it.descricao,u:it.unidade||"un",q:it.quantidade,qi:it.quantidade,cu,min:0,s:[],perdas:[]});
    });
  }
  sdb(db);
  fd._autoLancado=true;
}
